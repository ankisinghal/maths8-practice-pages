<script>const D={"id": "me184331e29", "date": "2026-11-04", "type": "TEST", "level": 2, "qs": [{"id": "M8C08025", "q": "Ariba has 120% as many marbles as Arun. Arun has what percentage of Ariba's marbles?", "o": ["120", "20", "250/3", "80"], "a": 2, "x": "If Arun has 100, Ariba has 120. Arun/Ariba x 100=100/120 x 100=250/3 percent.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rcuberootpo02", "q": "Find the positive cube root of 5832.", "o": ["17", "18", "20", "19"], "a": 1, "x": "18 \u00d7 18 \u00d7 18 = 5832.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C08081", "q": "Among students on an excursion, 40% are in Grade 8. Of those Grade 8 students, 60% are girls. What percentage of all excursion students are Grade 8 girls?", "o": ["40%", "100%", "60%", "24%"], "a": 3, "x": "The fraction is 0.40x 0.60=0.24, or 24%.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsquarebound01", "q": "A square courtyard has area 130 square metres. Its side length lies between which two consecutive whole numbers of metres?", "o": ["12 and 13", "10 and 11", "11 and 12", "13 and 14"], "a": 2, "x": "11^2 = 121 and 12^2 = 144, and 121 < 130 < 144, so the side is between 11 and 12 metres.", "t": "Squares and square roots", "svg": "", "cap": ""}, {"id": "M8C08168", "q": "Camera demand has fallen by 85% relative to a decade ago. Which statement has the same meaning?", "o": ["Demand now is 185% of demand a decade ago", "Demand a decade ago is 15% of demand now", "Demand now is 85% of demand a decade ago", "Demand now is 15% of demand a decade ago"], "a": 3, "x": "A fall of 85% leaves 100%-85%=15% of the original demand.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rpythagor01", "q": "Fill in the positive integer x in 6^2 + 7^2 + 42^2 = x^2.", "o": ["43", "44", "41", "45"], "a": 0, "x": "6^2 + 7^2 = 85 and 42^2 = 1764, total 1849 = 43^2, so x = 43.", "t": "Squares and square roots", "svg": "", "cap": ""}, {"id": "M8C08164", "q": "A halwa recipe for four people uses rava:sugar:ghee proportions 40%:40%:20% by mass. When the recipe is doubled for eight people, what are the new proportions?", "o": ["40%:40%:20%", "80%:80%:40%", "20%:20%:10%", "50%:30%:20%"], "a": 0, "x": "Doubling every ingredient doubles the total. Each ingredient remains the same fraction of the total.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rratioshr00", "q": "A 315 ml juice blend mixes orange, apple and mango in the ratio 2:4:3. How many ml of apple does it contain?", "o": ["35", "140", "105", "70"], "a": 1, "x": "The 2+4+3 = 9 parts share 315 ml, so each part is 35 ml. Apple has 4 parts: 4 x 35 = 140 ml.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C08116", "q": "Which is the largest value?", "o": ["3/8", "0.38", "39%", "2/5"], "a": 3, "x": "2/5=40%, 3/8=37.5%, and 0.38=38%. Thus 40% is largest.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rinvworkq00", "q": "96 identical machines finish a fixed printing order in 77 days. How many machines are needed to finish it in 56 days at the same rate?", "o": ["132", "116", "124", "154"], "a": 0, "x": "Machine-days are fixed: 96 x 77 = 7392. Divide by 56 days to get 132 machines.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
