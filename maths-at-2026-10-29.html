"30\" font-size=\"14\">Cost (Rs)</text></svg>", "cap": "Cost versus weight for rice; the line passes through (4, 100)."}, {"id": "M8C10120", "q": "y is inversely proportional to x. If x becomes 3 times as large, what happens to y?", "o": ["It remains exactly the same", "It becomes 1/3 of its previous value", "It becomes 1/9 of its previous value", "It also becomes 3 times as large"], "a": 1, "x": "In inverse proportion xy stays constant, so multiplying x by 3 divides y by 3.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rsubstitute01", "q": "Evaluate 3a(3a - 2) at a = -3.", "o": ["102", "-99", "63", "99"], "a": 3, "x": "Substitute -3: 3 \u00d7 (-3) \u00d7 (-11) = 99.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8Rsquareminm03", "q": "What is the least positive integer by which 150 must be multiplied to make a perfect square?", "o": ["6", "1", "3", "2"], "a": 0, "x": "The least multiplier is 6: 150 \u00d7 6 = 900 = 30^2. All smaller positive multipliers fail.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C10123", "q": "What is (2/3)\u00b3?", "o": ["8/9", "8/27", "2/27", "4/27"], "a": 1, "x": "(2/3)\u00b3 = (2 \u00d7 2 \u00d7 2)/(3 \u00d7 3 \u00d7 3) = 8/27.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C10124", "q": "What is 1.5\u00b2?", "o": ["3", "22.5", "2.25", "2.5"], "a": 2, "x": "1.5\u00b2 = 1.5 \u00d7 1.5 = 2.25.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rdirectscal14", "q": "A machine fills 44 bottles in 8 minutes. At the same rate, how many bottles does it fill in 14 minutes?", "o": ["154", "88", "58", "77"], "a": 3, "x": "The machine fills 44/8 = 11/2 bottles per minute, so in 14 minutes it fills 14 \u00d7 11/2 = 77 bottles. Doubling 8 minutes to 16 gives 88 bottles, but 14 minutes is 7/4 times 8 minutes, not 2 times.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rrationalad01", "q": "Find (-2/5) + (1/3).", "o": ["14/15", "-1/15", "1/15", "11/15"], "a": 1, "x": "Use a common denominator: -2/5 + 1/3 = -1/15.", "t": "Rational numbers", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
