<script>const D={"id": "m4334071569", "date": "2026-10-14", "type": "C01", "level": 2, "qs": [{"id": "M8C01011", "q": "Which positive integer cubed equals 4913?", "o": ["23", "13", "17", "19"], "a": 2, "x": "17 x 17 = 289, and 289 x 17 = 4913.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01053", "q": "A square has area 441 square m. Its side length is increased by 2 m. By how many square m does its area increase?", "o": ["92", "4", "84", "88"], "a": 3, "x": "Original side 21, new side 23. Increase = 23^2-21^2 = 529-441 = 88.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01070", "q": "Which number cannot be a perfect square, based only on its units digit?", "o": ["287", "625", "256", "361"], "a": 0, "x": "A whole-number square never ends in 2,3,7 or 8. Since 287 ends in 7 it cannot be a square; the other choices are 16^2,25^2 and 19^2.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01074", "q": "A positive whole number has exactly 3 trailing zeros in its decimal representation. How many trailing zeros does its square have?", "o": ["5", "6", "3", "9"], "a": 1, "x": "Write the number as 1000k, where k is not divisible by 10. Its square is 10^6 k^2, and k^2 is not divisible by 10, giving exactly 6 zeros.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01088", "q": "What is the sum of the first 18 positive odd integers?", "o": ["306", "324", "342", "361"], "a": 1, "x": "The sum of the first n positive odd integers is n^2. For n=18, it is 324.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01083", "q": "Given 500=2^2x 5^3, find the smallest positive integer multiplier that makes the result a perfect cube.", "o": ["10", "4", "2", "5"], "a": 2, "x": "The 2 exponent needs one more factor 2. Then 1000=2^3x 5^3=10^3.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C07027", "q": "A tap fills 500 mL in 15 seconds. At the same constant rate, how many litres flow in 2 minutes?", "o": ["3", "8", "2", "4"], "a": 3, "x": "Two minutes=120 seconds, eight 15-second intervals.8 x 500mL= 4000mL= 4L.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C01091", "q": "How many integers lie strictly between 20^2 and 21^2?", "o": ["40", "39", "41", "42"], "a": 0, "x": "The squares differ by 41. Excluding both endpoints leaves 41-1=40 integers.", "t": "A Square and A Cube", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
