<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C01-C10 practice m1a159e9a17</title>
<style>h1{overflow-wrap:anywhere}.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{overflow-wrap:anywhere;border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>C01-C10 practice m1a159e9a17</h1><p>8 questions &middot; level L2 &middot; about 15 to 20 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "m1a159e9a17", "date": "2026-10-25", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C10057", "q": "A map has scale 1:6000000. A measured straight-line separation on the map is 2.5 cm. What corresponding geographical separation is represented, in km?", "o": ["150", "15", "60", "240"], "a": 0, "x": "One map cm represents 60 km, so 2.5 \u00d7 60 = 150 km. This is not road distance.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10003", "q": "Odiya:Hindi:English book counts are 3:2:1. There are 288 Odiya books. How many Hindi books are there?", "o": ["144", "576", "96", "192"], "a": 3, "x": "One part=288/3=96. Hindi has 2 parts,192 books.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10092", "q": "Food provisions feed 80 students for 15 days. With equal constant per-student consumption and no waste, how many days would 100 students be fed?", "o": ["18", "10", "12", "15"], "a": 2, "x": "The food provides 80 \u00d7 15 = 1200 student-days; 1200/100 = 12 days.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10040", "q": "The ordered pairs (x,y) are (40,20),(80,10),(25,32),(16,50). What is the common product xy?", "o": ["40", "800", "1600", "400"], "a": 1, "x": "The products are 40 \u00d7 20 = 800, 80 \u00d7 10 = 800, 25 \u00d7 32 = 800 and 16 \u00d7 50 = 800.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C01104", "q": "A source pattern has 9 rows of 9 square blocks. Each block contains a 5 by 5 grid of tiny squares. How many tiny squares are there altogether?", "o": ["1825", "625", "2025", "405"], "a": 2, "x": "There are 81 blocks, each with 25 tiny squares. Total = 81 \u00d7 25 = 2025.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01094", "q": "Which expression has a base ending in 8 and a squared value ending in 4?", "o": ["64^2", "292^2", "36^2", "108^2"], "a": 3, "x": "108 ends in 8, and 8^2 = 64 ends in 4, so 108^2 ends in 4. 292^2 also ends in 4, but 292 ends in 2, not 8. 64^2 and 36^2 end in 6. Only 108^2 meets both conditions.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rdirectscal00", "q": "A painter uses 5 litres of paint for 12 equal-sized panels. At the same paint thickness and ratio, how many litres are needed for 30 such panels?", "o": ["25/2", "10", "2/5", "5/2"], "a": 0, "x": "The scale factor is 30/12 = 5/2, not 2. Paint needed = 5 \u00d7 (5/2) = 25/2 litres.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rexponentpr00", "q": "Evaluate (2^4 \u00d7 2^2) / 2^3.", "o": ["3", "8", "16", "4"], "a": 1, "x": "Same-base exponent laws give exponent 4 + 2 - 3 = 3. The value is 8.", "t": "Power Play", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
