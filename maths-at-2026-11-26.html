<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C01-C10 practice m442b2ff55b</title>
<style>h1{overflow-wrap:anywhere}.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{overflow-wrap:anywhere;border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>C01-C10 practice m442b2ff55b</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "m442b2ff55b", "date": "2026-11-26", "type": "C01-C10", "level": 2, "qs": [{"id": "M8Rsubstitute09", "q": "Evaluate 3a(4a - 5) at a = -5.", "o": ["375", "225", "-375", "380"], "a": 0, "x": "Substitute a = -5: 4a - 5 = -25 and 3a = -15, so the value is (-15) x (-25) = 375.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8Rsquareminm10", "q": "What is the least positive integer by which 76 must be multiplied to make a perfect square?", "o": ["38", "2", "19", "4"], "a": 2, "x": "76 = 4 x 19 = 2^2 x 19. The unpaired prime is 19, so multiply by 19.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rconsecutivegap06", "q": "How many EVEN whole numbers lie strictly between 12 squared and 13 squared?", "o": ["13", "11", "24", "12"], "a": 3, "x": "Strictly between 144 and 169 there are 24 whole numbers, half of them even: 146, 148, ..., 168, which is 12 numbers.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rsquarepar03", "q": "Initially 200 lockers numbered 1 to 200 are all closed. For each k from 1 to 200, person k toggles every locker whose number is a multiple of k. How many lockers are open at the end?", "o": ["15", "14", "13", "100"], "a": 1, "x": "Only perfect-square lockers end open (odd divisor count). Squares up to 200: 1, 4, 9, ..., 196 - that is 14 lockers.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rinvshare02", "q": "360 marbles shared equally among 24 children give 15 marbles each. If the same 360 marbles are shared equally among 18 children, how many marbles does each child get?", "o": ["16", "15", "24", "20"], "a": 3, "x": "The total is fixed at 360; fewer children means more each: 360 / 18 = 20 marbles.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rdirectpairs02", "q": "Which set of ordered pairs (x, y) shows x and y in direct proportion?", "o": ["(2, 24), (5, 60), (9, 108)", "(3, 36), (6, 72), (11, 130)", "(1, 12), (6, 72), (10, 110)", "(4, 48), (7, 84), (13, 150)"], "a": 0, "x": "Direct proportion needs the same ratio y/x throughout: here y = 12x for all three pairs. Each other set has one pair with a different ratio.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rdirectfactor02", "q": "A conveyor belt moves parcels at a fixed rate. If it runs for 8/5 times as long, the number of parcels moved becomes what multiple of the original?", "o": ["2", "5/8", "8/5", "3"], "a": 2, "x": "Parcels moved and time are in direct proportion at a fixed rate, so the count multiplies by the same factor: 8/5.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rcubefrac00", "q": "What is (3/4) cubed?", "o": ["27/64", "9/64", "8/27", "27/16"], "a": 0, "x": "(3/4)^3 = (3 x 3 x 3)/(4 x 4 x 4) = 27/64.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rdirectgraph00", "q": "A graph shows the cost of potatoes (in Rs) against weight (in kg) as a straight line through the origin and the point (5, 60). Using the graph, what is the cost of 8 kg of potatoes?", "o": ["120", "75", "96", "480"], "a": 2, "x": "The line passes through (5, 60), so each kilogram costs 60/5 = Rs 12, and 8 kg costs 8 x 12 = Rs 96.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rinvdoubl00", "q": "y is inversely proportional to x. If x becomes 4 times as large, what happens to y?", "o": ["It also becomes 4 times as large", "It becomes 1/4 of its previous value", "It becomes 1/16 of its previous value", "It remains exactly the same"], "a": 1, "x": "In inverse proportion xy stays constant, so multiplying x by 4 divides y by 4.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
