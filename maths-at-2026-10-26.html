<h1>C01-C10 practice m0243def504</h1><p>8 questions &middot; level L2 &middot; about 15 to 20 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<script>const D={"id": "m0243def504", "date": "2026-10-26", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C10004", "q": "100 coins have counts of Rs 10:Rs 5:Rs 2:Rs 1 coins in ratio 4:3:2:1. What is their total value, in rupees?", "o": ["500", "600", "650", "550"], "a": 1, "x": "Counts are 40,30,20,10. Value=400+150+40+10=600.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10104", "q": "Among 360 voters,90 prefer summer,120 rainy season and the rest winter. What pie-chart angles in degrees correspond to summer,rainy,winter in that order?", "o": ["90, 150, 120", "120, 90, 150", "90, 120, 150", "90, 120, 180"], "a": 2, "x": "One voter corresponds to1degree because360voters fill360degrees. Winter has360-90-120=150 voters.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10046", "q": "Identical taps work at the same constant rate without interference to fill a fixed tank from empty. Doubling the number of taps changes the filling time in what way?", "o": ["It is reduced by 2 hours", "It stays the same", "It doubles", "It halves"], "a": 3, "x": "The combined rate doubles, while tank volume stays fixed, so the time halves.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10019", "q": "A car covers a route in 2 hours at 60 km/h. At 80 km/h, how long will the same route take, in hours?", "o": ["4/3", "8/3", "2", "3/2"], "a": 3, "x": "Distance 120 km; time 120/80=1.5=3/2 hours.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C01093", "q": "Two consecutive triangular numbers sum 100. The smaller is T_9=45. What is the larger?", "o": ["50", "55", "54", "65"], "a": 1, "x": "T_9+T_10=10^2=100, so T_10=100-45=55.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01054", "q": "A cube has volume 27000 cubic cm. Its edge is reduced by 10 cm. What is its new volume in cubic cm?", "o": ["8000", "9000", "1000", "17000"], "a": 0, "x": "Original edge 30 cm since 30^3=27000. New edge 20 cm gives 20^3=8000.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rdirectscal10", "q": "A recipe uses 4 cups of flour for 10 servings. At the same ratio, how many cups are needed for 25 servings?", "o": ["10", "19", "13/2", "8/5"], "a": 0, "x": "The scale factor is 25/10 = 5/2, so the flour needed is 4 \u00d7 5/2 = 10 cups.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rleastsquare00", "q": "What is the least positive perfect square divisible by both 4 and 6?", "o": ["12", "24", "36", "144"], "a": 2, "x": "A number divisible by both 4 and 6 is a multiple of 12. The multiples 12 and 24 are not perfect squares; the least perfect square is 36 = 6^2.", "t": "A Square and A Cube", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
