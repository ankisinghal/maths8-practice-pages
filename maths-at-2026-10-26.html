ans-serif\" font-size=\"19\" text-anchor=\"middle\">Cycle</text><text x=\"152.4500185\" y=\"212.0\" font-size=\"20\" text-anchor=\"middle\">60\u00b0</text><path d=\"M220 155 L95.0 155 A125 125 0 0 1 220 30.0 Z\" fill=\"#e6ead0\" stroke=\"#243c50\" stroke-width=\"2\"/><text x=\"164.8456711\" y=\"99.84567107\" font-family=\"system-ui,sans-serif\" font-size=\"19\" text-anchor=\"middle\">Walk</text><text x=\"164.8456711\" y=\"117.8456711\" font-size=\"20\" text-anchor=\"middle\">90\u00b0</text><text x=\"220\" y=\"315\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"19\">2W = two-wheeler. Total: 360 degrees.</text></svg>", "cap": "Schematic chart using the stated textbook data."}, {"id": "M8C10104", "q": "Among 360 voters,90 prefer summer,120 rainy season and the rest winter. What pie-chart angles in degrees correspond to summer,rainy,winter in that order?", "o": ["90, 150, 120", "90, 120, 150", "120, 90, 150", "90, 120, 180"], "a": 1, "x": "One voter corresponds to1degree because360voters fill360degrees. Winter has360-90-120=150 voters.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10046", "q": "Identical taps work at the same constant rate without interference to fill a fixed tank from empty. Doubling the number of taps changes the filling time in what way?", "o": ["It halves", "It stays the same", "It doubles", "It is reduced by 2 hours"], "a": 0, "x": "The combined rate doubles, while tank volume stays fixed, so the time halves.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C01093", "q": "Two consecutive triangular numbers sum 100. The smaller is T_9=45. What is the larger?", "o": ["50", "54", "55", "65"], "a": 2, "x": "T_9+T_10=10^2=100, so T_10=100-45=55.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01095", "q": "What is the last digit of 292^2?", "o": ["2", "6", "4", "8"], "a": 2, "x": "The last digit comes from 2^2=4.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rdirectscal02", "q": "A recipe uses 4 cups of flour for 12 servings. At the same ratio, how many cups are needed for 24 servings?", "o": ["10", "9", "4", "8"], "a": 3, "x": "Servings double from 12 to 24, so flour doubles from 4 to 8 cups.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C02045", "q": "Which expression is equal to 10^-2 \u00d7 10^-5?", "o": ["10^7", "10^-3", "10^10", "10^-7"], "a": 3, "x": "Multiply powers of the same base by adding exponents:-2+(-5)=-7.", "t": "Power Play", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
