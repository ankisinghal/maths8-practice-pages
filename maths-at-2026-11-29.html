<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C01-C10 practice mc22d61c74b</title>
<style>h1{overflow-wrap:anywhere}.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{overflow-wrap:anywhere;border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>C01-C10 practice mc22d61c74b</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "mc22d61c74b", "date": "2026-11-29", "type": "C01-C10", "level": 2, "qs": [{"id": "M8Rsubstitute12", "q": "Evaluate 8a(2a - 5) at a = -4.", "o": ["416", "-416", "420", "96"], "a": 0, "x": "Substitute a = -4: 2a - 5 = -13 and 8a = -32, so the value is (-32) x (-13) = 416.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8Rsquareminm13", "q": "What is the least positive integer by which 188 must be multiplied to make a perfect square?", "o": ["2", "4", "94", "47"], "a": 3, "x": "188 = 4 x 47 = 2^2 x 47. The unpaired prime is 47, so multiply by 47.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rconsecutivegap09", "q": "How many whole numbers lie strictly between 35 squared and 36 squared?", "o": ["71", "69", "70", "72"], "a": 2, "x": "Between n^2 and (n+1)^2 there are exactly 2n whole numbers: 2 x 35 = 70.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rsquarepar06", "q": "Initially 250 lockers numbered 1 to 250 are all closed. For each k from 1 to 250, person k toggles every locker whose number is a multiple of k. How many lockers are open at the end?", "o": ["16", "14", "125", "15"], "a": 3, "x": "Only perfect-square lockers end open (odd divisor count). Squares up to 250: 1, 4, 9, ..., 225 - that is 15 lockers.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rinvshare05", "q": "672 crayons shared equally among 48 students give 14 crayons each. If the same 672 crayons are shared equally among 42 students, how many crayons does each student get?", "o": ["16", "14", "42", "48"], "a": 0, "x": "The total is fixed at 672; fewer students means more each: 672 / 42 = 16 crayons.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rdirectpairs05", "q": "Which set of ordered pairs (x, y) shows x and y in direct proportion?", "o": ["(1, 14), (5, 70), (12, 162)", "(3, 42), (7, 98), (13, 180)", "(4, 56), (8, 112), (15, 214)", "(2, 28), (6, 84), (9, 126)"], "a": 3, "x": "Direct proportion needs the same ratio y/x throughout: here y = 14x for all three pairs. Each other set has one pair with a different ratio.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rdirectfactor05", "q": "An escalator carries people at a fixed rate. If it runs for 11/4 times as long, the number of people carried becomes what multiple of the original?", "o": ["11/4", "2", "4/11", "3"], "a": 0, "x": "People carried and time are in direct proportion at a fixed rate, so the count multiplies by the same factor: 11/4.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rpiesec00", "q": "A pie chart shows Chores 35%, Play 40%, Study 15%, Reading 10%. What is the Play sector angle in degrees?", "o": ["40", "144", "160", "120"], "a": 1, "x": "Play is 40% of the circle: 40/100 x 360 = 144 degrees.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rqualratio00", "q": "Regular lemonade uses syrup:water = 1:4. Sweetness increases with the syrup-to-water ratio. A batch uses syrup:water = 1:3. Compared with regular, the batch tastes:", "o": ["Cannot compare", "Sweeter", "Less sweet", "Same sweetness"], "a": 1, "x": "The batch has more syrup per unit water (1/3 > 1/4), so it is sweeter.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rratioadj00", "q": "Red and white paint are mixed in the ratio 2:5 in 35 mL. Add 15 mL of white paint. What is the new red:white ratio?", "o": ["2:5", "2:7", "1:4", "1:5"], "a": 2, "x": "The 35 mL split gives red 10 mL and white 25 mL. Adding 15 mL white makes white 40 mL, so red:white = 10:40 = 1:4.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
