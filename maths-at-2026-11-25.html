<style>h1{overflow-wrap:anywhere}.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{overflow-wrap:anywhere;border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>C01-C10 practice m9b6451eddd</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "m9b6451eddd", "date": "2026-11-25", "type": "C01-C10", "level": 2, "qs": [{"id": "M8Rsubstitute08", "q": "Evaluate 5a(2a - 3) at a = -4.", "o": ["44", "-220", "100", "220"], "a": 3, "x": "Substitute -4: 5 x (-4) x (2 x (-4) - 3) = 5 x (-4) x (-11) = 220.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8Rsquareminm09", "q": "What is the least positive integer by which 52 must be multiplied to make a perfect square?", "o": ["26", "13", "2", "4"], "a": 1, "x": "52 = 2^2 x 13. The unpaired prime is 13, so the least multiplier is 13: 52 x 13 = 676 = 26^2. All smaller positive multipliers fail.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rconsecutivegap05", "q": "How many whole numbers lie strictly between 25 squared and 26 squared?", "o": ["52", "50", "51", "49"], "a": 1, "x": "26^2 - 25^2 = 676 - 625 = 51. Strictly between excludes both squares, so 51 - 1 = 50.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rsquarepar02", "q": "Initially 70 lockers numbered 1 to 70 are all closed. For each k from 1 to 70, person k toggles every locker whose number is a multiple of k. How many lockers are open at the end?", "o": ["7", "9", "35", "8"], "a": 3, "x": "A locker ends open only when toggled an odd number of times, which happens exactly for square numbers. Squares up to 70: 1, 4, 9, 16, 25, 36, 49, 64 - that is 8 lockers.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rinvshare01", "q": "240 pencils shared equally among 20 students give 12 pencils each. If the same 240 pencils are shared equally among 16 students, how many pencils does each student get?", "o": ["10", "12", "18", "15"], "a": 3, "x": "The total is fixed at 240; fewer students means more each: 240 / 16 = 15 pencils.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}, {"id": "M8Rdirectpairs01", "q": "Which set of ordered pairs (x, y) shows x and y in direct proportion?", "o": ["(5, 40), (8, 64), (15, 125)", "(4, 32), (9, 72), (12, 100)", "(3, 24), (6, 48), (11, 88)", "(2, 16), (6, 40), (10, 80)"], "a": 2, "x": "In direct proportion y/x stays constant. Here 24/3 = 48/6 = 88/11 = 8; every other set has at least one pair with a different ratio.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}, {"id": "M8Rdirectfactor01", "q": "A tap fills a tank at a fixed rate. If it runs for 7/3 times as long, the volume of water in the tank becomes what multiple of the original?", "o": ["2", "7/3", "3", "3/7"], "a": 1, "x": "Volume and time are in direct proportion at a fixed rate, so the volume multiplies by the same factor: 7/3.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}, {"id": "M8Rdirectconst00", "q": "y is directly proportional to x. When x = 8, y = 26. What is y when x = 12?", "o": ["36", "52", "39", "38"], "a": 2, "x": "The constant is 26/8 = 13/4, so at x = 12, y = 12 x 13/4 = 39.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}, {"id": "M8Rsquaresum00", "q": "What is the value of 1^2 + 2^2 + 3^2 + 4^2 + 5^2 + 6^2 + 7^2?", "o": ["140", "135", "144", "126"], "a": 0, "x": "1 + 4 + 9 + 16 + 25 + 36 + 49 = 140. This also matches 7 x 8 x 15 / 6 = 140.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rdirectrate00", "q": "Shop A sells 750 g of detergent for Rs 180. Shop B sells 1 kg of the same detergent for Rs 250. Which shop is cheaper per kilogram?", "o": ["Shop A, at Rs 240 per kg", "Both cost the same per kg", "Shop A, at Rs 180 per kg", "Shop B, at Rs 250 per kg"], "a": 0, "x": "Shop A: 750 g costs Rs 180, so 1 kg costs 180 x 1000/750 = Rs 240. Shop B is Rs 250 per kg, so Shop A is cheaper at Rs 240 per kg.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
