<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C01 practice mafe8b6af51</title>
<style>h1{overflow-wrap:anywhere}.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{overflow-wrap:anywhere;border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>C01 practice mafe8b6af51</h1><p>8 questions &middot; level L2 &middot; about 15 to 20 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "mafe8b6af51", "date": "2026-10-13", "type": "C01", "level": 2, "qs": [{"id": "M8C01004", "q": "What is the least positive integer by which 9408 must be multiplied to make a perfect square?", "o": ["6", "7", "2", "3"], "a": 3, "x": "9408 = 2^6 x 3 x 7^2. Multiply by 3: 28224 = 168^2.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01009", "q": "What is the cube root of 10648?", "o": ["22", "18", "24", "32"], "a": 0, "x": "22 x 22 = 484; 484 x 22 = 10648.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01033", "q": "How many perfect squares are in the inclusive interval 101 to 200?", "o": ["3", "10", "5", "4"], "a": 3, "x": "They are 11^2=121, 12^2=144, 13^2=169 and 14^2=196.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01035", "q": "What is the positive square root of 1156?", "o": ["38", "32", "34", "36"], "a": 2, "x": "34 x 34 = 1156.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01043", "q": "Given 125 squared=15625, what is 126 squared?", "o": ["16137", "15876", "15751", "15887"], "a": 1, "x": "(125+1)^2=125^2+2x 125+1=15625+251=15876.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01044", "q": "Fill the positive integer n in 4^2+5^2+20^2=n^2.", "o": ["19", "22", "21", "20"], "a": 2, "x": "16+25+400=441=21^2.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C07001", "q": "Six glasses of lemonade use 10 spoons of sugar. How many spoons are needed for 18 additional glasses at the same sweetness?", "o": ["20", "30", "10", "40"], "a": 1, "x": "18 additional glasses are three times 6, so additional sugar is 3 x 10 = 30 spoons.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C01007", "q": "How many integers lie strictly between 99 squared and 100 squared?", "o": ["198", "199", "99", "200"], "a": 0, "x": "10000 - 9801 = 199; excluding both endpoints leaves 198.", "t": "A Square and A Cube", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
