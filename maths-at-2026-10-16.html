<script>const D={"id": "ma0c490cfa9", "date": "2026-10-16", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C10084", "q": "Cloth costs a fixed amount per metre. If the purchased length increases by 25%, what happens to the total price?", "o": ["It stays the same", "It increases by 25%", "It decreases by 25%", "It increases by 20%"], "a": 1, "x": "At a fixed price per metre, total price and length are directly proportional. Multiplying length by 1.25 multiplies price by 1.25, so price increases by 25%.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10079", "q": "Red, blue and white paint volumes stay in the ratio 2:3:5 as a batch is scaled up or down. What percentage of any batch is blue?", "o": ["50", "60", "20", "30"], "a": 3, "x": "The total is 2 + 3 + 5 = 10 equal parts. Blue is 3/10 of every batch, so (3/10) \u00d7 100 = 30%.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10031", "q": "Three equally productive workers can paint a fixed fence in 4 days. All three work for 2 days, then one leaves. Assuming no interference and unchanged work rate per worker, how many additional days do the remaining two need?", "o": ["3", "6", "2", "4"], "a": 0, "x": "The fixed job needs 3 \u00d7 4 = 12 worker-days. The first 2 days use 3 \u00d7 2 = 6 worker-days, leaving 6. Two workers need 6/2 = 3 additional days.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10102", "q": "Each ordered pair is (x, y).\nTable A: (40,20), (80,10), (25,32), (16,50).\nTable B: (40,20), (80,10), (25,12.5), (16,8).\nTable C: (30,15), (90,5), (150,3), (10,45).\nWhich tables show inverse proportion?", "o": ["Only B", "All three", "A and C", "Only A"], "a": 2, "x": "Inverse proportion requires the same product x \u00d7 y in every pair. All A products are 800; all C products are 450. B products are 800, 800, 312.5 and 128, so B fails.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C01054", "q": "A cube has volume 27000 cubic cm. Its edge is reduced by 10 cm. What is its new volume in cubic cm?", "o": ["17000", "9000", "8000", "1000"], "a": 2, "x": "Original edge 30 cm since 30^3=27000. New edge 20 cm gives 20^3=8000.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01072", "q": "Which units digits can a whole number have if its square ends in 1?", "o": ["1 or 9", "1 only", "4 or 6", "3 or 7"], "a": 0, "x": "Testing the units digits 0 through 9, only 1^2 and 9^2 end in 1.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rdirectscal06", "q": "A machine uses 7/2 litres of dye to print 14 equal banners. At the same constant dye use per banner, how many litres are needed for 18 such banners?", "o": ["11/2", "63/2", "49/18", "9/2"], "a": 3, "x": "Dye per banner = (7/2)/14 = 1/4 litre. For 18 banners, use 18 \u00d7 (1/4) = 9/2 litres. Equivalently, the scale factor is 18/14 = 9/7.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rconsecutivegap01", "q": "How many integers lie strictly between 42 squared and 43 squared?", "o": ["86", "84", "85", "83"], "a": 1, "x": "43^2 - 42^2 = 1849 - 1764 = 85. Excluding both endpoints leaves 85 - 1 = 84 integers.", "t": "A Square and A Cube", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
