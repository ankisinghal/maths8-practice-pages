<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PREVIEW practice workerpreview</title>
<style>.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Worker preview: applications</h1><p>Quality check only. Eight distinct source families. Mixed levels are intentional.</p><p>8 questions &middot; level L3 &middot; about 15 to 20 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Worker test code (not a learner attempt):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "workerpreview", "date": "2026-10-11", "type": "PREVIEW", "level": 3, "qs": [{"id": "M8C14040", "q": "A rectangular park is 20 m by 10 m. A uniform outside path has area 136 square m. What is its width, in m?", "o": ["3", "4", "2", "1"], "a": 2, "x": "Let the width be w. Then (20 + 2w)(10 + 2w) - 200 = 136. This gives w^2 + 15w - 34 = 0 = (w - 2)(w + 17), so the positive width is 2 m.", "t": "Area", "svg": "", "cap": ""}, {"id": "M8C14038", "q": "A 20 m by 12 m rectangular garden has two perpendicular paths crossing through it: one runs the full 20 m length with width 2 m; the other runs the full 12 m length with width 3 m. Find the total path area in square m.", "o": ["70", "76", "6", "64"], "a": 0, "x": "Areas are 20 x 2 and 12 x 3. The intersection 2 x 3 is counted twice, so subtract it once: 40 + 36 - 6 = 70.", "t": "Area", "svg": "", "cap": ""}, {"id": "M8C14043", "q": "A rectangle has perimeter 48 cm and integer side lengths. Its length is twice its width. Find its area in square cm.", "o": ["256", "144", "96", "128"], "a": 3, "x": "Length + width = 24. With ratio 2:1, the sides are 16 and 8; area = 128.", "t": "Area", "svg": "", "cap": ""}, {"id": "M8C07035", "q": "A 60 mL paint mixture has blue:yellow ratio 2:3. A second mixture has blue:yellow ratio 3:1. How many mL of the second mixture must be added to obtain ratio 1:1?", "o": ["36", "24", "48", "12"], "a": 1, "x": "The first mixture has 24 blue and 36 yellow. If v mL is added, 24 + 3v/4 = 36 + v/4; hence v/2 = 12 and v = 24.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C08038", "q": "A price is discounted by 10% and then by 20% of the reduced price. What single discount is equivalent to both?", "o": ["32%", "18%", "28%", "30%"], "a": 2, "x": "Remaining fraction = 0.9 x 0.8 = 0.72. The equivalent discount is 28%.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8C10036", "q": "A pump fills a tank in 6 hours. A drain empties a full tank in 12 hours. Both rates are constant. Starting empty, with pump and drain open together, how many hours to fill the tank?", "o": ["12", "6", "18", "4"], "a": 0, "x": "Net filling rate = 1/6 - 1/12 = 1/12 tank per hour, so filling takes 12 hours.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C13038", "q": "A cart pays Rs 5000 daily rent and Rs 10 to make each dosa. It sells at Rs 50 each, except that one-fifth of the dosas made are given away free. How many dosas must it make to earn exactly Rs 1000 daily profit?", "o": ["150", "250", "175", "200"], "a": 3, "x": "For n dosas made, 4n/5 are sold. Revenue = 50 x 4n/5 = 40n; total cost = 5000 + 10n. Profit = 30n - 5000. Setting this to 1000 gives n = 200.", "t": "Algebra Play", "svg": "", "cap": ""}, {"id": "M8C13042", "q": "A two-digit number has digit sum 12. Its reversal is 18 smaller than the original. What is the original number?", "o": ["66", "75", "84", "57"], "a": 1, "x": "Let tens a and units b. a + b = 12 and 9(a - b) = 18, so a - b = 2. Thus a = 7, b = 5; the number is 75.", "t": "Algebra Play", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied worker code.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
