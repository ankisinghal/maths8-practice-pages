<script>const D={"id": "figure-preview-20261011", "date": "2026-10-11", "type": "PREVIEW", "level": 2, "qs": [{"id": "M8C03076", "q": "Use positional base 2 with digits 0 and 1 and place values 1,2,4,8,... from right to left. Which numeral represents decimal 6?", "o": ["101", "111", "110", "100"], "a": 2, "x": "Decimal 6 has base 2 representation 110; each 1 selects its power-of-two place.", "t": "A Story of Numbers", "svg": "", "cap": ""}, {"id": "M8C03077", "q": "Use positional base 2 with digits 0 and 1 and place values 1,2,4,8,... from right to left. Which numeral represents decimal 13?", "o": ["1101", "1010", "1110", "1011"], "a": 0, "x": "Decimal 13 has base 2 representation 1101; each 1 selects its power-of-two place.", "t": "A Story of Numbers", "svg": "", "cap": ""}, {"id": "M8C03078", "q": "Use positional base 2 with digits 0 and 1 and place values 1,2,4,8,... from right to left. Which numeral represents decimal 19?", "o": ["10101", "11001", "10001", "10011"], "a": 3, "x": "Decimal 19 has base 2 representation 10011; each 1 selects its power-of-two place.", "t": "A Story of Numbers", "svg": "", "cap": ""}, {"id": "M8C03079", "q": "Use positional base 2 with digits 0 and 1 and place values 1,2,4,8,... from right to left. Which numeral represents decimal 32?", "o": ["100001", "100000", "10000", "11111"], "a": 1, "x": "Decimal 32 has base 2 representation 100000; each 1 selects its power-of-two place.", "t": "A Story of Numbers", "svg": "", "cap": ""}, {"id": "M8C03080", "q": "A positional base 2 numeral 10110 has place values 16,8,4,2,1 from left to right. What is its decimal value?", "o": ["18", "20", "22", "26"], "a": 2, "x": "The nonzero contributions are 16+4+2=22.", "t": "A Story of Numbers", "svg": "", "cap": ""}, {"id": "M8C03081", "q": "Using positional base 2 digits 0 and 1, which numeral immediately follows 111?", "o": ["1000", "1110", "112", "1010"], "a": 0, "x": "111 equals 7 in decimal. The next value 8 uses the new 8s position:1000.", "t": "A Story of Numbers", "svg": "", "cap": ""}, {"id": "M8C03082", "q": "How many distinct four-digit positional base 2 numerals have first digit 1? The other digits may repeat.", "o": ["4", "7", "16", "8"], "a": 3, "x": "The first digit is fixed. Each of the other three positions has two choices:2^3=8.", "t": "A Story of Numbers", "svg": "", "cap": ""}, {"id": "M8C03083", "q": "In positional base 2, what is the decimal value of the sum 101+11?", "o": ["7", "8", "16", "6"], "a": 1, "x": "101 means 5 and 11 means 3. Their sum is 8, which would be written 1000 in base 2.", "t": "A Story of Numbers", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
