<script>const D={"id": "figure-preview-20261011", "date": "2026-10-11", "type": "PREVIEW", "level": 3, "qs": [{"id": "M8C01079", "q": "Given 3375=3^3x 5^3, which expression writes it as three identical integer factors?", "o": ["3x5x225", "45x45x45", "15x15x15", "9x25x15"], "a": 2, "x": "Each group contains 3x 5=15, and 15^3=3375. The expression 3x 5x 225 also multiplies to 3375 but its factors are not identical.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01081", "q": "Given 3375=3^3x 5^3, what is the smallest positive integer by which it can be divided to leave a perfect cube smaller than 3375?", "o": ["27", "9", "5", "3"], "a": 0, "x": "Removing a whole cube-prime block is required. The least nontrivial cube divisor is 3^3=27;3375/27=125=5^3.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01083", "q": "Given 500=2^2x 5^3, find the smallest positive integer multiplier that makes the result a perfect cube.", "o": ["5", "10", "4", "2"], "a": 3, "x": "The 2 exponent needs one more factor 2. Then 1000=2^3x 5^3=10^3.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C03085", "q": "On a decimal counting board, ten ones counters are exchanged for one tens counter. When adding 2907+43, how many tens counters are present after that exchange?", "o": ["10", "5", "4", "0"], "a": 1, "x": "There are 0 tens from 2907 and 4 from 43; the ones carry adds 1, giving 5 tens.", "t": "A Story of Numbers", "svg": "", "cap": ""}, {"id": "M8C03088", "q": "In a grouped base 10 additive notation, one symbol represents each power of 10 and symbols add. A standard representation always exchanges 10 equal symbols for one symbol of the next power. What is the largest permitted count of any one symbol after complete regrouping?", "o": ["1", "11", "9", "10"], "a": 2, "x": "A count of 10 or more can still be regrouped. Complete regrouping leaves at most 9 of each symbol.", "t": "A Story of Numbers", "svg": "", "cap": ""}, {"id": "M8C07069", "q": "Twelve indivisible counters are shared between A and B. A receives more than B and both receive a positive whole number. How many allocations are possible?", "o": ["5", "11", "6", "4"], "a": 0, "x": "A may receive 7, 8, 9, 10 or 11. These five allocations leave B with 5, 4, 3, 2 or 1.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C07071", "q": "Twelve indivisible counters must be shared exactly between A and B with no leftovers. Which ratio(A:B) is impossible?", "o": ["1:3", "1:5", "1:2", "2:3"], "a": 3, "x": "Ratio 2:3 has five units, and 12/5 is not a whole number. The other unit totals 3, 4, 6 all divide 12.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C07076", "q": "Counters are shared between A and B in the ratio 4:3. A receives 6 more than B. How many counters does B receive?", "o": ["42", "18", "24", "6"], "a": 1, "x": "The difference is one ratio unit, so each unit is 6. B gets 3 units, or 18.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
