<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PREVIEW practice workerpreview</title>
<style>.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Worker preview: reasoning</h1><p>Quality check only. Eight different source families; mixed levels are intentional.</p><p>8 questions &middot; level L3 &middot; about 15 to 20 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Worker test code (not a learner attempt):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "workerpreview", "date": "2026-10-11", "type": "PREVIEW", "level": 3, "qs": [{"id": "M8C14053", "q": "Triangle ABC has area 90 square cm. D is the midpoint of BC, and E is the midpoint of AD. Find the area of triangle EBD, in square cm.", "o": ["45", "30", "22.5", "15"], "a": 2, "x": "The median AD halves the area, so ABD has area 45. E has half the height of A above BD, so EBD has half of 45, namely 22.5.", "t": "Area", "svg": "", "cap": ""}, {"id": "M8C06060", "q": "For an odd positive integer n, what remainder does n^2 always leave on division by 8?", "o": ["1", "0", "7", "3"], "a": 0, "x": "Write n =2k +1. Its square is 4k(k +1) +1; the consecutive product k(k +1) is even, so the first term is divisible by 8.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8C08046", "q": "A shop aims to average Rs 5000 sales per day over six days. It sells Rs 2000,3500,5000,6000 and 7800 on the first five days. What sixth-day sales amount is needed to meet the target exactly?", "o": ["9550", "5000", "6700", "5700"], "a": 3, "x": "Required six-day total =30000. First five sum 24300. Needed 30000 -24300 =5700.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8C07047", "q": "Under supplied constant rates, a tractor ploughs four times as fast as a pair of oxen. Oxen take 6 hours per acre. The tractor alone works 3 hours, then the oxen join it. How many additional hours to complete a 5-acre field?", "o": ["9/2", "18/5", "3", "6"], "a": 1, "x": "Tractor rate 2/3 acre per hour, so it first completes 2 acres. Remaining 3 acres; combined rate 2/3 +1/6 =5/6. Time 3/(5/6) =18/5 hours.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C11044", "q": "A Koch snowflake starts with perimeter 27 cm. Each step multiplies the perimeter by 4/3. What is the first step number at which the perimeter exceeds 60 cm?", "o": ["1", "4", "3", "2"], "a": 2, "x": "Perimeters after steps 1,2,3 are 36,48,64. Step 3 is the first over 60.", "t": "Exploring Some Geometric Themes", "svg": "", "cap": ""}, {"id": "M8C01060", "q": "Find the least positive integer by which 432 must be divided to give a perfect cube integer.", "o": ["2", "6", "4", "3"], "a": 0, "x": "432 =2^4 x 3^3. Remove one factor 2 to leave 216 =6^3.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C12050", "q": "A group of 20 has mean score 15. A second group has mean score 20. The combined mean is 18. How many people are in the second group?", "o": ["20", "25", "40", "30"], "a": 3, "x": "If the second group has n people, 300 + 20n = 18(20 + n). Thus 2n = 60 and n = 30.", "t": "Tales by Dots and Lines", "svg": "", "cap": ""}, {"id": "M8C03032", "q": "In an additive Roman system, C = 100, X = 10 and I = 1. Find the decimal value of CCXXXII + CCCCXIII.", "o": ["545", "645", "655", "635"], "a": 1, "x": "CCXXXII is 232 and CCCCXIII is 413. Their sum is 645.", "t": "A Story of Numbers", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied worker code.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
