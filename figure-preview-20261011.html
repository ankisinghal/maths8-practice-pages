<script>const D={"id": "figure-preview-20261011", "date": "2026-10-11", "type": "PREVIEW", "level": 3, "qs": [{"id": "M8C13056", "q": "A sum pyramid has bottom row 1,2,3,5,8. Every entry above is the sum of the two adjacent entries below. What is the top?", "o": ["34", "89", "55", "19"], "a": 2, "x": "The successive rows are 3,5,8,13;8,13,21;21,34;55. Adjacent Fibonacci entries give the next Fibonacci entry.", "t": "Algebra Play", "svg": "", "cap": ""}, {"id": "M8C05067", "q": "Five consecutive whole numbers have greatest member p. Which expression gives their sum?", "o": ["5p-10", "5p-5", "5p+10", "5p-4"], "a": 0, "x": "Addingp,p-1,p-2,p-3,p-4 gives 5p-10.", "t": "Number Play", "svg": "", "cap": ""}, {"id": "M8C10041", "q": "The ordered pairs are (40,20),(80,10),(25,12.5),(16,8). Are x and y inversely proportional?", "o": ["Yes, because all values are positive", "Yes, because the first two products agree", "Yes, because some x values increase", "No, the products xy are not all equal"], "a": 3, "x": "The first two products are 800, but 25x 12.5=312.5 and 16x 8=128. Equal products are required throughout.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C14056", "q": "A regular hexagon has side length s and apothem h, where the apothem is the perpendicular distance from the centre to a side. Which expression gives its area?", "o": ["sh", "3sh", "6sh", "3s^2"], "a": 1, "x": "Six triangles each have base s and height h. Total area is 6 x sh/2 =3sh.", "t": "Area", "svg": "", "cap": ""}, {"id": "M8C01077", "q": "A positive whole number has exactly 2 trailing zeros. Its cube has how many trailing zeros?", "o": ["8", "2", "6", "4"], "a": 2, "x": "Write the number as 100k where k is not divisible by 10. Cubing gives 10^6 k^3, so exactly 6 zeros.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C11066", "q": "A right circular cylinder has radius 3 cm and height 8 cm. Its axis is vertical. Viewed horizontally from the side by parallel sight lines, what are the rectangular outline's width and height?", "o": ["6 cm and8 cm", "6 cm and16 cm", "3 cm and8 cm", "8 cm and8 cm"], "a": 0, "x": "The width is the diameter 2x 3=6 cm and the height is 8 cm.", "t": "Exploring Some Geometric Themes", "svg": "", "cap": ""}, {"id": "M8C05069", "q": "For a positive whole number n, consider the claim \"if n is not divisible by 18, then n is not divisible by 9\". Which classification is correct?", "o": ["Never true", "True for every odd n", "Always true", "Sometimes true"], "a": 3, "x": "n=10 makes both statements true. n=9 is not divisible by 18 but is divisible by 9, so the claim fails there.", "t": "Number Play", "svg": "", "cap": ""}, {"id": "M8C10044", "q": "Quantities x and y are in inverse proportion, with x=16 when y=9. Find x when y=48.", "o": ["144", "3", "27", "48"], "a": 1, "x": "The constant product is 144, so x=144/48=3.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
