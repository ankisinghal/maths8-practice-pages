 "3", "4"], "a": 0, "x": "Sorted:0, 0, 0, 0, 1, 2, 3, 4, 5. The 5th value, the median, is 1.", "t": "Tales by Dots and Lines", "svg": "", "cap": ""}, {"id": "M8C11079", "q": "A right circular cone has slant height 13 cm. Its curved surface is opened into a circular sector. What is the radius of that sector, in cm?", "o": ["6.5", "169", "26", "13"], "a": 3, "x": "Every straight apex-to-rim generator has length 13. It becomes a radius of the sector.", "t": "Exploring Some Geometric Themes", "svg": "", "cap": ""}, {"id": "M8C11082", "q": "A right triangular prism has a right-triangle base with perpendicular sides 3 and 4 cm, hypotenuse 5 cm and prism length 7 cm. Find the area of its full closed net, in square cm.", "o": ["108", "96", "84", "90"], "a": 1, "x": "The three side rectangles total 84. Each triangle has area 3x 4/2=6. Full net area 84+2x 6=96.", "t": "Exploring Some Geometric Themes", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
