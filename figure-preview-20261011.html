<script>const D={"id": "figure-preview-20261011", "date": "2026-10-11", "type": "PREVIEW", "level": 3, "qs": [{"id": "M8C08081", "q": "Among students on an excursion, 40% are in Grade 8. Of those Grade 8 students, 60% are girls. What percentage of all excursion students are Grade 8 girls?", "o": ["60%", "40%", "24%", "100%"], "a": 2, "x": "The fraction is 0.40x 0.60=0.24, or 24%.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8C08082", "q": "A shopkeeper buys identical pencils at a fixed unit cost. The selling price of 3 pencils equals the cost of 5 pencils. What is the profit percentage on cost?", "o": ["200/3%", "150%", "50%", "40%"], "a": 0, "x": "For unit cost c, the unit selling price is 5c/3. Profit is 2c/3, or 200/3% of cost.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8C08084", "q": "A rectangle's length increases 10% while its area stays unchanged. By what exact percentage does its breadth decrease?", "o": ["11%", "1/10%", "10%", "100/11%"], "a": 3, "x": "The new breadth is 1/1.1=10/11 of the original. The decrease is 1/11, or 100/11%.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8C08086", "q": "A room has 100 people, 99 of whom are left-handed. Only left-handed people leave. How many must leave for the remaining group to be 98% left-handed?", "o": ["2", "50", "1", "49"], "a": 1, "x": "The one right-handed person must be 2% of the remaining group, so 50 people remain. Exactly 50 left-handed people have left;49/50=98%.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8C06073", "q": "An interior region has area (m+n)^2-4mn square units. If m=3 and n=8, what is its area?", "o": ["73", "24", "25", "121"], "a": 2, "x": "The supplied identity (m+n)^2-4mn=(n-m)^2 gives(8-3)^2=25.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8C06078", "q": "A region has area x(x+2y)-3xy square units. For x=7 and y=2, find the area.", "o": ["35", "14", "77", "9"], "a": 0, "x": "x(x+2y)-3xy=x^2-xy. Substitution gives 7^2-7x 2=35.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8C14064", "q": "A trapezium has parallel sides 8 cm and 16 cm and area 96 square cm. What is its perpendicular height, in cm?", "o": ["12", "6", "4", "8"], "a": 3, "x": "The mean parallel-side length is 12 cm. Height is 96/12=8 cm.", "t": "Area", "svg": "", "cap": ""}, {"id": "M8C14065", "q": "A trapezium has area 90 square cm, height 6 cm and one parallel side 12 cm. Find the other parallel side, in cm.", "o": ["24", "18", "15", "30"], "a": 1, "x": "The parallel-side sum is 2x 90/6=30. Subtract 12 to obtain 18.", "t": "Area", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
