<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIAG practice m27a39469cd</title>
<style>body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>DIAG practice m27a39469cd</h1><p>8 questions &middot; level L2 &middot; about 15 to 20 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "m27a39469cd", "date": "2026-10-11", "type": "DIAG", "level": 2, "qs": [{"id": "M8D001", "q": "Find (-3/4) + (5/6).", "o": ["-1/12", "2/12", "1/12", "-19/12"], "a": 2, "x": "Use denominator 12: -9/12 + 10/12 = 1/12.", "t": "Rational numbers"}, {"id": "M8D002", "q": "Solve 3(2x - 5) = 4x + 7.", "o": ["11", "22", "4", "-11"], "a": 0, "x": "6x - 15 = 4x + 7, so 2x = 22 and x = 11.", "t": "Linear equations"}, {"id": "M8D003", "q": "Three interior angles of a quadrilateral are 85, 110 and 95 degrees. Find the fourth angle.", "o": ["80", "60", "90", "70"], "a": 3, "x": "Interior angles sum to 360 degrees. 360 - 85 - 110 - 95 = 70.", "t": "Quadrilaterals"}, {"id": "M8D004", "q": "Find the least positive integer by which 180 must be multiplied to make a perfect square.", "o": ["10", "5", "3", "2"], "a": 1, "x": "180 = 2^2 x 3^2 x 5. Multiply by 5 to make 900 = 30^2.", "t": "Square roots"}, {"id": "M8D005", "q": "Find the cube root of 1728.", "o": ["6", "18", "12", "24"], "a": 2, "x": "12 x 12 x 12 = 1728.", "t": "Cube roots"}, {"id": "M8D006", "q": "Evaluate (2^5 x 2^3) / 2^4.", "o": ["16", "32", "8", "64"], "a": 0, "x": "For equal bases, add exponents when multiplying and subtract when dividing: 2^(5+3-4) = 16.", "t": "Powers"}, {"id": "M8D007", "q": "A recipe uses 3 cups of flour for 8 servings. At the same ratio, how many cups are needed for 20 servings?", "o": ["8/3", "20/3", "15/4", "15/2"], "a": 3, "x": "Flour per serving is 3/8 cup. For 20 servings: 20 x 3/8 = 15/2 cups.", "t": "Proportional reasoning"}, {"id": "M8D008", "q": "Evaluate 3a(2a - 1) at a = -2.", "o": ["18", "30", "-30", "-18"], "a": 1, "x": "Substitute first: 3(-2)(-4 - 1) = (-6)(-5) = 30.", "t": "Algebra"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
