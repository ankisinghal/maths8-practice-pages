<script>const D={"id": "m3566bacbfc", "date": "2026-11-03", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C08049", "q": "A farmer harvests 260 kg of wheat one year and 650 kg the next. What percentage of the earlier harvest is the later harvest?", "o": ["150%", "350%", "40%", "250%"], "a": 3, "x": "650/260 =2.5, so the later harvest is 250% of the earlier.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsubstitute04", "q": "Evaluate 6a(3a - 5) at a = -6.", "o": ["468", "-828", "828", "834"], "a": 2, "x": "Substitute -6: 6 \u00d7 (-6) \u00d7 (-23) = 828.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8C08193", "q": "The textbook sweater manufacturer pays Rs 230 and sells for Rs 253. What is the exact profit percentage on cost?", "o": ["23%", "9%", "11%", "10%"], "a": 3, "x": "Profit = 23. Divide by cost price 230 and multiply by 100: 10%.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsqldigit00", "q": "What is the last digit of 231^2?", "o": ["7", "9", "1", "3"], "a": 2, "x": "The last digit comes from 1^2 = 1.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C08007", "q": "Rs 20000 earns 10% interest compounded annually for 2 years. What is the final amount in rupees?", "o": ["24200", "24000", "22000", "4200"], "a": 0, "x": "After year 1:22000. After year 2:22000x 1.1=24200.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rpartperim01", "q": "The three sides of a triangle are in the ratio 3:4:5. If its shortest side is 27 cm, what is its perimeter, in cm?", "o": ["144", "108", "81", "99"], "a": 1, "x": "The ratio total is 3+4+5 = 12 parts. The shortest side is 3 parts = 27 cm, so one part is 9 cm. Perimeter = 12 x 9 = 108 cm.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C08101", "q": "A cake has a marked price of Rs 200. Successive discounts of 30% and 20% are applied. What is its final price, in rupees?", "o": ["100", "112", "120", "140"], "a": 1, "x": "After 30% off, price 200 x 0.7=140. After 20% off that, price 140 x 0.8=112.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rconsecutivegap03", "q": "How many whole numbers lie strictly between 17^2 and 18^2?", "o": ["34", "35", "33", "36"], "a": 0, "x": "18^2 - 17^2 = 324 - 289 = 35. Strictly between excludes both squares, so 35 - 1 = 34.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C08028", "q": "A seller marks an item 50% above its cost. What discount percentage on the marked price brings the selling price exactly back to cost?", "o": ["20", "50", "25", "100/3"], "a": 3, "x": "Cost 100, marked price 150. Discount 50 relative to 150 is 100/3 percent.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rratiotri00", "q": "Which of these ratios can be the side lengths of a triangle?", "o": ["3:4:8", "2:3:6", "5:6:9", "1:2:3"], "a": 2, "x": "A triangle exists only when the two smaller parts sum to more than the largest: 5+6>9 works; 1+2=3, 2+3<6 and 3+4<8 all fail.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};

</script></body></html>
