<style>h1{overflow-wrap:anywhere}.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{overflow-wrap:anywhere;border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>C01-C10 practice mbf3a79d17</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "mbf3a79d17", "date": "2026-11-30", "type": "C01-C10", "level": 2, "qs": [{"id": "M8Rsubstitute13", "q": "Evaluate 5a(3a - 7) at a = -3.", "o": ["-240", "240", "96", "120"], "a": 1, "x": "Substitute a = -3: 3a - 7 = -16 and 5a = -15, so the value is (-15) x (-16) = 240.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8Rsquareminm14", "q": "What is the least positive integer by which 275 must be multiplied to make a perfect square?", "o": ["5", "55", "11", "25"], "a": 2, "x": "275 = 25 x 11 = 5^2 x 11. The unpaired prime is 11, so multiply by 11: 275 x 11 = 3025 = 55^2.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rconsecutivegap10", "q": "How many whole numbers lie strictly between 44 squared and 45 squared?", "o": ["88", "90", "89", "87"], "a": 0, "x": "Between n^2 and (n+1)^2 there are exactly 2n whole numbers: 2 x 44 = 88.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rsquarepar07", "q": "Initially 300 lockers numbered 1 to 300 are all closed. For each k from 1 to 300, person k toggles every locker whose number is a multiple of k. How many lockers are open at the end?", "o": ["150", "16", "17", "18"], "a": 2, "x": "Locker n is toggled once for each divisor of n, so it ends open only when n has an odd number of divisors, which is exactly the perfect squares. The perfect squares up to 300 are 1^2 to 17^2: 17 lockers.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rinvshare06", "q": "840 books shared equally among 40 students give 21 books each. If the same 840 books are shared equally so that each student gets 24 books, how many students are there?", "o": ["35", "42", "28", "30"], "a": 0, "x": "Each share rises from 21 to 24, so the number of students falls: 840 / 24 = 35 students.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rdirectpairs06", "q": "Which set of ordered pairs (x, y) shows x and y in direct proportion?", "o": ["(2, 32), (9, 144), (14, 220)", "(5, 80), (8, 128), (13, 204)", "(4, 64), (6, 96), (15, 235)", "(3, 48), (7, 112), (11, 176)"], "a": 3, "x": "Direct proportion needs the same ratio y/x throughout: here y = 16x for all three pairs. Each other set has one pair with a different ratio.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rdirectfactor06", "q": "A conveyor belt moves parcels at a fixed rate. If it runs for 13/6 times as long, the number of parcels moved becomes what multiple of the original?", "o": ["6/13", "2", "19/6", "13/6"], "a": 3, "x": "Parcels moved and time are in direct proportion at a fixed rate, so the count multiplies by the same factor: 13/6.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Runitrate00", "q": "Each minibus seats 32 people. If 250 people travel in 9 such minibuses, how many seats remain empty?", "o": ["36", "38", "42", "40"], "a": 1, "x": "Nine minibuses seat 9 x 32 = 288 people, so 288 - 250 = 38 seats remain empty.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rspeeddist00", "q": "A 150 km journey takes 2 hours 30 minutes at constant speed. At what speed, in km/h, was it covered?", "o": ["60", "55", "75", "65"], "a": 0, "x": "2 hours 30 minutes = 2.5 hours, so speed = 150 / 2.5 = 60 km/h.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rinvpiece00", "q": "Four equally productive workers can build a wall in 6 days. All four work for 2 days, then two of them leave. How many more days will the remaining two workers need to finish the wall?", "o": ["4", "12", "6", "8"], "a": 3, "x": "The wall needs 4 x 6 = 24 worker-days. The four complete 4 x 2 = 8 worker-days, leaving 16 worker-days, which two workers finish in 16 / 2 = 8 more days.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
