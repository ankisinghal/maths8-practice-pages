<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C01-C10 practice m0aed71e710</title>
<style>h1{overflow-wrap:anywhere}.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{overflow-wrap:anywhere;border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>C01-C10 practice m0aed71e710</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "m0aed71e710", "date": "2026-10-28", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C10111", "q": "Which set of ordered pairs (x, y) shows x and y in direct proportion?", "o": ["(1, 5), (2, 10), (3, 30)", "(3, 12), (5, 20), (8, 32)", "(4, 10), (6, 15), (9, 20)", "(2, 8), (4, 16), (6, 20)"], "a": 1, "x": "In direct proportion every y/x is equal. In (3, 12), (5, 20), (8, 32) each ratio is 4. The other sets have at least one pair with a different ratio.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C10112", "q": "A loom weaves cloth at a fixed rate. If it runs for 5/2 times as long, the length of cloth woven becomes what multiple of the original?", "o": ["5/2", "2", "3", "3/2"], "a": 0, "x": "Length and time are in direct proportion at a fixed rate, so the length multiplies by the same factor: 5/2.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C10113", "q": "y is directly proportional to x. When x = 6, y = 15. What is y when x = 10?", "o": ["21", "20", "25", "30"], "a": 2, "x": "The constant is 15/6 = 5/2, so at x = 10, y = 10 \u00d7 5/2 = 25.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C10103", "q": "With other conditions fixed, which complete list of pairs is inversely proportional? (1) identical tap count and fixed-tank fill time; (2) equally efficient painter count and fixed-wall time; (3) distance possible and petrol quantity at fixed efficiency; (4) speed and time on a fixed route; (5) cloth length and price at a fixed rate; (6) book pages and reading time at fixed speed.", "o": ["3, 5 and 6", "1, 2 and 3", "All six", "1, 2 and 4"], "a": 3, "x": "Fixed work gives count x time constant for1and2; fixed route gives speed x time constant for4. The other pairs are direct, with fixed rates.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10114", "q": "A cart wheel makes 540 rotations to cross a field. A second wheel with 3/2 times the circumference would make how many rotations over the same distance?", "o": ["270", "360", "810", "405"], "a": 1, "x": "Rotations \u00d7 circumference is the fixed distance, so rotations scale by the inverse factor 2/3: 540 \u00d7 2/3 = 360.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10115", "q": "A lever balances when load \u00d7 arm length is the same on both sides. A 24 kg stone sits 50 cm from the pivot. How many kilograms must sit 120 cm from the pivot on the other side to balance it?", "o": ["20", "10", "8", "12"], "a": 1, "x": "Load \u00d7 arm is fixed: 24 \u00d7 50 = 1200, so the other side needs 1200 / 120 = 10 kg.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C01108", "q": "What is the value of 1\u00b2 + 2\u00b2 + 3\u00b2 + 4\u00b2 + 5\u00b2?", "o": ["55", "45", "60", "50"], "a": 0, "x": "1 + 4 + 9 + 16 + 25 = 55. This also matches 5 \u00d7 6 \u00d7 11 / 6 = 55.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01107", "q": "What is (\u22129)\u00b3?", "o": ["-729", "-81", "-243", "729"], "a": 0, "x": "(\u22129)\u00b3 = \u2212(9 \u00d7 9 \u00d7 9) = \u2212729; an odd number of negative factors gives a negative result.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rdirectscal13", "q": "A car travels 9 km on 2 litres of petrol. At the same rate, how many kilometres does it go on 7 litres?", "o": ["18", "27", "63/4", "63/2"], "a": 3, "x": "The car goes 9/2 km per litre, so on 7 litres it goes 7 \u00d7 9/2 = 63/2 km. Doubling 9 gives 18, but 7 litres is 3.5 times 2 litres, not 2 times.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rquadrilate00", "q": "A quadrilateral has three interior angles 70, 80 and 90 degrees. Find its fourth angle in degrees.", "o": ["130", "140", "120", "110"], "a": 2, "x": "The four angles sum to 360 degrees. Subtract 240 to get 120.", "t": "Quadrilaterals", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
