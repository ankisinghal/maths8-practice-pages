<style>h1{overflow-wrap:anywhere}.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{overflow-wrap:anywhere;border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>C01-C10 practice ma03f409b04</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "ma03f409b04", "date": "2026-11-02", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C08031", "q": "A shop discounts an item 20% and the buyer pays Rs 960. What was its marked price in rupees?", "o": ["768", "1000", "1200", "1152"], "a": 2, "x": "Rs 960 is 80% of the marked price. Marked price=960/(80/100)=1200.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rdirectscal15", "q": "A recipe uses 5 cups of flour for 8 servings. At the same ratio, how many cups are needed for 40 servings?", "o": ["32", "25", "16", "20"], "a": 1, "x": "40 servings is 5 times 8 servings, so the flour is 5 times 5 cups = 25 cups.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C08088", "q": "Write 7/14 as a percentage. Give the number before the percent sign, exactly.", "o": ["200", "7", "50", "14"], "a": 2, "x": "Multiply the fraction by100: (7/14)x100=50.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsquareminm06", "q": "What is the least positive integer by which 28 must be multiplied to make a perfect square?", "o": ["14", "7", "2", "4"], "a": 1, "x": "28 = 2^2 x 7. The unpaired prime is 7, so the least multiplier is 7: 28 x 7 = 196 = 14^2.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C08027", "q": "A mobile phone has price Rs 8250 before 18% GST. What is the final price in rupees?", "o": ["1485", "9900", "8268", "9735"], "a": 3, "x": "Tax=8250x 18/100=1485. Total 8250+1485=9735.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsqrarea01", "q": "A square has area 3025 square metres. What is its side length in metres?", "o": ["55", "50", "65", "45"], "a": 0, "x": "55^2 = 3025, so the side length is 55 m.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C08066", "q": "A vase costs Rs 2650. It sells at loss 18% of its cost. What is its selling price, in rupees?", "o": ["2385", "477", "2173", "3127"], "a": 2, "x": "Selling price is 82% of 2650 =2173.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsubstitute05", "q": "Evaluate 7a(3a - 6) at a = -7.", "o": ["1330", "735", "-1323", "1323"], "a": 3, "x": "Substitute -7: 7 \u00d7 (-7) \u00d7 (-27) = 1323.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8C08075", "q": "Jasmine invests Rs 25000 for 4 years at 6% yearly simple interest. What total amount is returned, in rupees?", "o": ["31000", "26500", "6000", "30000"], "a": 0, "x": "Four years add 24% of 25000 =6000; the final amount is 31000.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rparttotal00", "q": "A rope is cut into two pieces in the ratio 3:4. If the shorter piece is 36 cm, what is the total length of the rope, in centimetres?", "o": ["48", "96", "60", "84"], "a": 3, "x": "3 parts = 36 cm, so 1 part = 12 cm. The total is (3 + 4) parts = 7 x 12 = 84 cm.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
