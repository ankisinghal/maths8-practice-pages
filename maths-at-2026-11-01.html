<script>const D={"id": "m8626b11052", "date": "2026-11-01", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C10031", "q": "Three equally productive workers paint a fence in 4 days. All three work for 2 days, then one leaves. How many additional days do the remaining two need?", "o": ["6", "2", "3", "4"], "a": 2, "x": "Total work 12 worker-days. Six used, six remain. Two workers need 3 more days.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C01095", "q": "What is the last digit of 292^2?", "o": ["6", "4", "2", "8"], "a": 1, "x": "The last digit comes from 2^2=4.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01013", "q": "What is 13 squared?", "o": ["195", "143", "169", "26"], "a": 2, "x": "13 squared is 13 x 13 = 169.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01034", "q": "What is the largest perfect square strictly less than 1000?", "o": ["961", "900", "980", "1024"], "a": 0, "x": "31^2=961 and 32^2=1024, so 961 is the largest square below 1000.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rconsecutivegap01", "q": "Every whole number from 24 squared through 25 squared, including both ends, is printed on a separate card. All cards showing perfect squares are removed. How many cards remain?", "o": ["47", "48", "50", "49"], "a": 1, "x": "The endpoints are 576 and 625, giving 625 - 576 + 1 = 50 cards. They are consecutive squares, so only the two endpoint cards show squares. Removing them leaves 50 - 2 = 48 cards.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01040", "q": "What is the positive cube root of 729?", "o": ["8", "10", "9", "18"], "a": 2, "x": "9 x 9 x 9 = 729.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rpythagor00", "q": "Fill in the positive integer x in 8^2 + 9^2 + 72^2 = x^2.", "o": ["71", "72", "75", "73"], "a": 3, "x": "64 + 81 + 5184 = 5329 = 73^2. Equivalently n^2+(n+1)^2+(n(n+1))^2 = (n(n+1)+1)^2 with n = 8, giving 73^2.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rsubstitute03", "q": "Evaluate 5a(3a - 4) at a = -5.", "o": ["475", "480", "-475", "275"], "a": 0, "x": "Substitute -5: 5 \u00d7 (-5) \u00d7 (-19) = 475.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8Ridentical00", "q": "Six identical printers complete a full print order in 10 hours. Working at the same constant rate, how many hours do four such printers need for the same order?", "o": ["12", "6", "9", "15"], "a": 3, "x": "The order needs 6 x 10 = 60 printer-hours. Four printers need 60 / 4 = 15 hours.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rpartperim00", "q": "The three sides of a triangle are in the ratio 5:12:13. If its longest side is 39 cm, what is its perimeter, in cm?", "o": ["45", "60", "78", "90"], "a": 3, "x": "The ratio total is 5+12+13 = 30 parts. The longest side is 13 parts = 39 cm, so one part is 3 cm. Perimeter = 30 x 3 = 90 cm.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
