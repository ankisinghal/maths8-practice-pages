<h1>C01-C10 practice m3f176ed2af</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<script>const D={"id": "m3f176ed2af", "date": "2026-11-07", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C08198", "q": "Rs 50000 is invested for 3 years at 7% per year. How much more interest does annual compounding give than simple interest, in rupees?", "o": ["11252.15", "735", "752.15", "10500"], "a": 2, "x": "Compound interest =50000[(1.07)^3-1]=11252.15. Simple interest =10500. Difference =752.15.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rdirectscal16", "q": "A machine fills 36 bottles in 4 minutes. At the same rate, how many bottles does it fill in 15 minutes?", "o": ["125", "120", "135", "145"], "a": 2, "x": "Rate: 36 / 4 = 9 bottles per minute. In 15 minutes: 9 x 15 = 135 bottles.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C12001", "q": "Find the arithmetic mean of 8, 3, 10, 13, 4, 6, 7, 7, 8, 8 and 5.", "o": ["79/10", "79/11", "8", "7"], "a": 1, "x": "The eleven values sum to 79, so the exact mean is 79/11.", "t": "Tales by Dots and Lines", "svg": "", "cap": ""}, {"id": "M8Rsimint00", "q": "Rs 18000 is invested at 5% per year simple interest for 3 years. What is the total amount at the end, in rupees?", "o": ["2070", "20700", "18900", "22500"], "a": 1, "x": "Interest = 18000 x 5% x 3 = 2700. Amount = 18000 + 2700 = 20700 rupees.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8C08134", "q": "Using 24 hours per day and 7 days per week, how many minutes longer is 10% of a day than 1% of a week?", "o": ["14.4", "144", "216/5", "100.8"], "a": 2, "x": "The times are144 and100.8 minutes. Difference=43.2 minutes=216/5 minutes.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsquaregrid00", "q": "A pattern is made of 6 by 6 blocks. Each block is a 3 by 3 arrangement of tiny squares. How many tiny squares are there in total?", "o": ["324", "288", "342", "264"], "a": 0, "x": "6 x 6 = 36 blocks; each block has 3 x 3 = 9 tiny squares. Total = 36 x 9 = 324.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C12005", "q": "Mean measured height is 150.2 cm. Every student wore shoes that added 1 cm. What is the mean height without shoes, in cm?", "o": ["149.2", "150.2", "151.2", "126.2"], "a": 0, "x": "Subtracting 1 from every measurement subtracts 1 from the mean:149.2 cm.", "t": "Tales by Dots and Lines", "svg": "", "cap": ""}, {"id": "M8Rparttotal01", "q": "A rope is cut into two pieces in the ratio 2:5. If the shorter piece is 26 m, what is the total length of the rope, in metres?", "o": ["65", "91", "78", "104"], "a": 1, "x": "2 parts = 26 m, so 1 part = 13 m. Total = (2 + 5) parts = 7 x 13 = 91 m.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rinvratedir00", "q": "Twelve identical machines can finish a job in a certain number of days. If 16 such machines are used instead, what happens to the time needed?", "o": ["Stays the same", "Cannot be determined", "Increase", "Decrease"], "a": 3, "x": "More identical machines share the same work, so the job finishes sooner: the time decreases.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rratequiv00", "q": "Which of these ratios is equivalent to 24:36?", "o": ["16:20", "9:12", "14:24", "10:15"], "a": 3, "x": "24:36 simplifies to 2:3. Among the options, only 10:15 also simplifies to 2:3 (9:12 = 3:4, 14:24 = 7:12, 16:20 = 4:5).", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
