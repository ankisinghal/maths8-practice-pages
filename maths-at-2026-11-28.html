<h1>C01-C10 practice mf4b4502788</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<script>const D={"id": "mf4b4502788", "date": "2026-11-28", "type": "C01-C10", "level": 2, "qs": [{"id": "M8Rsubstitute11", "q": "Evaluate 7a(2a - 3) at a = -6.", "o": ["378", "635", "630", "-630"], "a": 2, "x": "Substitute a = -6: 2a - 3 = -15 and 7a = -42, so the value is (-42) x (-15) = 630.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8Rsquareminm12", "q": "What is the least positive integer by which 207 must be multiplied to make a perfect square?", "o": ["9", "46", "23", "3"], "a": 2, "x": "207 = 9 x 23 = 3^2 x 23. The unpaired prime is 23, so multiply by 23.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rconsecutivegap08", "q": "Every whole number from 26 squared through 27 squared, including both ends, is printed on a separate card. All cards showing perfect squares are removed. How many cards remain?", "o": ["51", "53", "54", "52"], "a": 3, "x": "From 26^2 to 27^2 inclusive is 729 - 676 + 1 = 54 cards. Only the two endpoint cards show perfect squares, so 54 - 2 = 52 remain.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rsquarepar05", "q": "Initially 180 lockers numbered 1 to 180 are all closed. For each k from 1 to 180, person k toggles every locker whose number is a multiple of k. How many lockers are open at the end?", "o": ["14", "90", "12", "13"], "a": 3, "x": "Only perfect-square lockers end open (odd divisor count). Squares up to 180: 1, 4, 9, ..., 169 - that is 13 lockers.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rinvshare04", "q": "540 notebooks shared equally among 36 students give 15 notebooks each. If the same 540 notebooks are shared equally among 30 students, how many notebooks does each student get?", "o": ["15", "18", "36", "30"], "a": 1, "x": "The total is fixed at 540; fewer students means more each: 540 / 30 = 18 notebooks.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rdirectpairs04", "q": "Which set of ordered pairs (x, y) shows x and y in direct proportion?", "o": ["(4, 52), (8, 104), (15, 190)", "(2, 26), (5, 65), (9, 117)", "(3, 39), (7, 91), (12, 150)", "(1, 13), (6, 78), (11, 140)"], "a": 1, "x": "Direct proportion needs the same ratio y/x throughout: here y = 13x for all three pairs. Each other set has one pair with a different ratio.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rdirectfactor04", "q": "A hose fills a drum at a fixed rate. If it runs for 9/5 times as long, the volume of water in the drum becomes what multiple of the original?", "o": ["5/9", "2", "9/5", "4"], "a": 2, "x": "Volume and time are in direct proportion at a fixed rate, so the volume multiplies by the same factor: 9/5.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rdensity00", "q": "Equal volumes of copper and water have masses in the ratio 89:10. If 1 litre of water weighs 1 kg, what is the mass of 1 litre of copper, in kg?", "o": ["89", "0.89", "4.45", "8.9"], "a": 3, "x": "Masses of equal volumes scale with the ratio: 89/10 = 8.9 kg.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rpatterncnt00", "q": "In one repeating unit of a bead string, red bead counts in three sections are 5, 3, 4 and blue bead counts are 2, 1, 3. What is the ratio of red to blue beads in simplest form?", "o": ["2:1", "1:2", "4:3", "3:1"], "a": 0, "x": "Red totals 5+3+4 = 12 and blue totals 2+1+3 = 6, so red:blue = 12:6 = 2:1.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rpiechart00", "q": "A pie chart shows how children travel: Bus 150 degrees, Walk 60 degrees, Cycle 90 degrees, Car 60 degrees. If 30 children walk, how many children were surveyed?", "o": ["180", "240", "90", "120"], "a": 0, "x": "Walk is 60 degrees out of 360, one sixth of the total. 30 walkers are one sixth, so 6 x 30 = 180 children.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
