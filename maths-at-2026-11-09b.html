<script>const D={"id": "m4c365d052b", "date": "2026-11-09", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C09002", "q": "A right triangle has perpendicular sides 5 cm and 12 cm. Find its hypotenuse, in cm.", "o": ["169", "7", "13", "17"], "a": 2, "x": "By Pythagoras, c^2=25+144=169, so c=13 cm.", "t": "The Baudhayana-Pythagoras Theorem", "svg": "", "cap": ""}, {"id": "M8Rsquareminm07", "q": "What is the least positive integer by which 147 must be multiplied to make a perfect square?", "o": ["7", "11", "2", "3"], "a": 3, "x": "147 = 3 x 49 = 3 x 7^2. One more factor of 3 gives 3^2 x 7^2 = 441 = 21^2.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rsqrarea03", "q": "A square has area 6889 square metres. What is its side length, in metres?", "o": ["83", "78", "82", "88"], "a": 0, "x": "6889 = 83 x 83, so the side is 83 m.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rsquarepar01", "q": "Initially 90 lockers numbered 1 to 90 are all closed. For each k from 1 to 90, person k toggles every locker whose number is a multiple of k. After everyone has taken a turn, how many lockers are open?", "o": ["10", "11", "7", "9"], "a": 3, "x": "A locker ends open only when toggled an odd number of times, which happens exactly for square numbers. Squares from 1 to 90: 1, 4, 9, 16, 25, 36, 49, 64, 81 - that is 9 lockers.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Roddsum00", "q": "What is the sum of the first 12 positive odd integers?", "o": ["100", "144", "169", "121"], "a": 1, "x": "The sum of the first n odd numbers is n^2. 12^2 = 144.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rsqareasub00", "q": "A square sheet has area 200 square cm. A 12 cm by 12 cm square is cut out from it. What area remains, in square cm?", "o": ["44", "64", "56", "76"], "a": 2, "x": "Cut area = 12 x 12 = 144. Remaining = 200 - 144 = 56 square cm.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rcuberecall00", "q": "What is 15 cubed (15^3)?", "o": ["3375", "225", "3275", "3475"], "a": 0, "x": "15^3 = 15 x 15 x 15 = 225 x 15 = 3375.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rpcttable00", "q": "A textbook survey of 60 students records how they travel: cycle 18, bus 21, walk 15, car 6. What percentage of the students walk or cycle?", "o": ["50%", "45%", "60%", "55%"], "a": 3, "x": "Walk or cycle = 18 + 15 = 33 of 60 students. 33/60 = 0.55 = 55%.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rinvtile00", "q": "A floor is covered completely by 240 identical square tiles, each of area 60 square cm. How many tiles of area 90 square cm would be needed to cover the same floor completely?", "o": ["180", "160", "120", "150"], "a": 1, "x": "Floor area = 240 x 60 = 14400 square cm. Tiles of 90 square cm: 14400 / 90 = 160.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rpctnumber00", "q": "What is 45% of 360?", "o": ["16.2", "162", "172", "152"], "a": 1, "x": "45% of 360 = 0.45 x 360 = 162.", "t": "Fractions in Disguise", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
