<h1>C01-C10 practice m9f25d1abb9</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "m9f25d1abb9", "date": "2026-11-06", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C08014", "q": "A number increased by 20% becomes 90. What was the original number?", "o": ["72", "75", "108", "70"], "a": 1, "x": "1.2 times the number=90, so 90/1.2=75.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rinvspeed00", "q": "A bus covers its route in 15 hours at a steady 28 km/h. How many hours does the same route take at a steady 35 km/h?", "o": ["16", "12", "10", "14"], "a": 1, "x": "Route length = 15 x 28 = 420 km. At 35 km/h, time = 420/35 = 12 hours.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}, {"id": "M8C08020", "q": "One test score is 42/50; another is 70/80. By how many percentage points is the second score higher?", "o": ["2", "10", "3.5", "8"], "a": 2, "x": "Scores are 84% and 87.5%. Difference 87.5-84=3.5 percentage points.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rcubeneg00", "q": "Evaluate (-7)^3.", "o": ["21", "-343", "343", "-21"], "a": 1, "x": "(-7)^3 = (-7) x (-7) x (-7) = 49 x (-7) = -343.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C08136", "q": "Which is larger: 30% of 80 or 24% of 64?", "o": ["30% of 80", "Not enough information", "They are equal", "24% of 64"], "a": 0, "x": "30% of80=24;24% of64=15.36. The first is larger.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rinvconst00", "q": "x and y are inversely proportional. When x = 24, y = 33. What is y when x = 22?", "o": ["24", "30", "36", "44"], "a": 2, "x": "Constant product: xy = 24 x 33 = 792. When x = 22, y = 792/22 = 36.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}, {"id": "M8C08181", "q": "A bar represents a total of 90 and is divided into 10 equal parts. An arrow spans 6 parts. What amount does the arrow represent?", "o": ["45", "60", "54", "9"], "a": 2, "x": "Each part is 90/10= 9; six parts represent 6 x 9= 54.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsqinterval00", "q": "How many perfect squares lie strictly between 50 and 150?", "o": ["7", "6", "3", "5"], "a": 3, "x": "The squares between 50 and 150 are 64, 81, 100, 121 and 144 - five squares.", "t": "Squares and square roots", "svg": "", "cap": ""}, {"id": "M8C08179", "q": "At 10% interest compounded annually, how many complete years are first needed for Rs 1000 to reach or exceed Rs 2000?", "o": ["8", "10", "9", "7"], "a": 0, "x": "After 7 years the amount is about Rs 1948.72; after 8 it is about Rs 2143.59. The first complete year reaching Rs 2000 is year 8.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rpiecount00", "q": "In a survey of 60 students, 11 chose badminton. What is the angle of the badminton sector in a pie chart of the survey, in degrees?", "o": ["60", "33", "72", "66"], "a": 3, "x": "Sector angle = (11/60) x 360 = 66 degrees.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
