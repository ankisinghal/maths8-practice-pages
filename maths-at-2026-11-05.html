<script>const D={"id": "m0d17838f03", "date": "2026-11-05", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C08169", "q": "In an election, 1600 votes are cast and the winner receives 500. Every vote goes to one candidate. What is the minimum possible number of candidates?", "o": ["2", "3", "5", "4"], "a": 3, "x": "The other candidates together receive 1100 votes. Two others cannot receive 1100 while each has at most 500. Three others can: 400,400,300. So at least 4 candidates are needed.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rcuberootfa00", "q": "Given 9261 = 3^3 x 7^3, find its positive cube root.", "o": ["49", "21", "63", "27"], "a": 1, "x": "Combine one 3 and one 7 from each identical group: 3 x 7 = 21.", "t": "Squares and square roots", "svg": "", "cap": ""}, {"id": "M8C08097", "q": "Contest A takes Rs 100 and returns Rs 300 total. Contest B takes Rs 1000 and returns Rs 1500 total. Each may be used once. Which gives the greater absolute gain?", "o": ["B, by Rs 1200", "B, by Rs 300", "A, by Rs 300", "A, by Rs 150"], "a": 1, "x": "A gainsRs 200. B gainsRs 500. B hasRs 300 greater absolute gain, despite a lower percentage gain.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsqlpreim00", "q": "Which expression has a base ending in 3 and a squared value ending in 9?", "o": ["67^2", "71^2", "23^2", "38^2"], "a": 2, "x": "23 ends in 3, and 3^2 = 9, so 23^2 ends in 9. 67^2 also ends in 9 but its base ends in 7; 38^2 ends in 4; 71^2 ends in 1. Only 23^2 meets both conditions.", "t": "Squares and square roots", "svg": "", "cap": ""}, {"id": "M8C08098", "q": "An exercise sale offers either 20% off or Rs 50 off a bill of Rs 180. What is the smallest payable amount, in rupees?", "o": ["130", "144", "150", "136"], "a": 0, "x": "20% off savesRs 36 and leavesRs 144. Rs 50 off leavesRs 130, which is cheaper.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rinvxy00", "q": "Quantities x and y are in inverse proportion, with x=15 when y=14. Find x when y=35.", "o": ["6", "210", "7", "9"], "a": 0, "x": "The constant product is 15 x 14 = 210, so x = 210/35 = 6.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}, {"id": "M8C08054", "q": "Which fraction in lowest terms is equal to 358%?", "o": ["179/5", "179/500", "179/50", "358/10000"], "a": 2, "x": "358% =358/100 =179/50.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rmapscale00", "q": "A map has scale 1:250000. A route measures 8 cm on the map. What real distance does it represent, in km?", "o": ["2", "200", "20", "10"], "a": 2, "x": "1 map cm represents 250000 cm = 2.5 km, so 8 cm represents 8 x 2.5 = 20 km.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}, {"id": "M8C08158", "q": "A race diagram places A at about one-third of the way from Start to Finish. Which percentage is closest to this position among these choices?", "o": ["20%", "72%", "55%", "38%"], "a": 3, "x": "One third is about 33.3%. Of the listed source options, 38% is nearest.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rinvcons00", "q": "A grain store feeds 36 hens for 35 days. With equal daily consumption per hen and no waste, how many days will the same store feed 45 hens?", "o": ["32", "28", "24", "42"], "a": 1, "x": "The store holds 36 x 35 = 1260 hen-days of grain; 1260 / 45 = 28 days.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
