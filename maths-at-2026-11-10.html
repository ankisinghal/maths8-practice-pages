<h1>C01-C10 practice m0657d7b735</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<script>const D={"id": "m0657d7b735", "date": "2026-11-10", "type": "C01-C10", "level": 2, "qs": [{"id": "M8Rexprpct00", "q": "A cricket team scored 175 runs in its first match and 448 runs in its second match. What percentage of the first match's score is the second match's score?", "o": ["256%", "226%", "273%", "156%"], "a": 0, "x": "448/175 = 2.56, so the second score is 256% of the first.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rprofitpct00", "q": "A toy shop buys a puzzle for Rs 350 and sells it for Rs 371. What is the exact profit percentage on the cost price?", "o": ["7%", "6%", "21%", "5%"], "a": 1, "x": "Profit = 371 - 350 = 21. Divide by cost 350 and multiply by 100: 6%.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rcompound00", "q": "Rs 14000 earns 5% interest compounded annually for 2 years. What is the final amount in rupees?", "o": ["15435", "1435", "14700", "15400"], "a": 0, "x": "After year 1: 14000 x 1.05 = 14700. After year 2: 14700 x 1.05 = 15435.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsuccdisc00", "q": "A jacket has a marked price of Rs 800. Successive discounts of 25% and then 10% are applied. What is its final price, in rupees?", "o": ["540", "500", "520", "600"], "a": 0, "x": "After 25% off, price 800 x 0.75 = 600. After 10% off that, 600 x 0.9 = 540.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rmarkdisc00", "q": "A seller marks an item 75% above its cost. What discount percentage on the marked price brings the selling price exactly back to cost?", "o": ["65", "90", "75", "300/7"], "a": 3, "x": "Take cost as 100; the marked price is 175. The discount is 75 relative to 175, and 75/175 = 3/7, which is 300/7 percent.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rconsecutivegap04", "q": "How many whole numbers lie strictly between 29 squared and 30 squared?", "o": ["55", "58", "59", "57"], "a": 1, "x": "30^2 - 29^2 = 900 - 841 = 59. Strictly between excludes both squares, so 59 - 1 = 58.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rratiotri01", "q": "Which of these ratios can be the side lengths of a triangle?", "o": ["3:5:9", "1:4:6", "2:4:7", "4:7:9"], "a": 3, "x": "A triangle exists only when the two smaller parts sum to more than the largest: 4+7>9 works; 2+4<7, 3+5<9 and 1+4<6 all fail.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rsubstitute06", "q": "Evaluate 8a(3a - 7) at a = -8.", "o": ["-1984", "1736", "1984", "1992"], "a": 2, "x": "Substitute -8: 8 x (-8) x (-31) = 1984.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8Rdirecttable00", "q": "x and y are directly proportional. When x is 3, y is 27, and when x is 4, y is 36. What is y when x is 7?", "o": ["54", "49", "63", "72"], "a": 2, "x": "In direct proportion y is always the same multiple of x: 27 = 9 x 3 and 36 = 9 x 4, so at x = 7, y = 9 x 7 = 63.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rinvprice00", "q": "Identical water bottles cost Rs 94 each, and Rs 2162 buys 23 of them. If the price per bottle falls to Rs 46, how many bottles does the same Rs 2162 buy?", "o": ["21", "47", "53", "49"], "a": 1, "x": "The total money is fixed at 2162 = 94 x 23. At Rs 46 each, 2162 / 46 = 47 bottles; a lower price means more bottles.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
