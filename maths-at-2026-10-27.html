<script>const D={"id": "mf03d9e6954", "date": "2026-10-27", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C10106", "q": "Which ratio is equivalent to 4:6?", "o": ["9:6", "2:4", "6:9", "8:10"], "a": 2, "x": "4:6 simplifies to 2:3, and 6:9 also simplifies to 2:3. The others do not: 8:10 is 4:5, 9:6 is 3:2 and 2:4 is 1:2.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C10050", "q": "A textbook class has 40 students: gradeA 12, gradeB 10, gradeC 8, gradeD 6, gradeE 4. What percentage have gradeD or gradeE?", "o": ["20%", "15%", "30%", "25%"], "a": 3, "x": "The combined count is 10 of 40, a quarter or 25%.", "t": "Proportional Reasoning-2", "svg": "<svg viewBox=\"0 0 420 290\" role=\"img\" aria-label=\"Grade distribution pie chart: A12, B10, C8, D6, E4 of40 students\"><rect width=\"420\" height=\"290\" fill=\"white\"/><text x=\"210\" y=\"25\" text-anchor=\"middle\" font-size=\"18\" fill=\"#251f21\">Grades:40 students</text><path d=\"M130,151 L130.0000,56.0000 A95,95 0 0,1 220.3504,180.3566 Z\" fill=\"#73a89a\" stroke=\"#251f21\" stroke-width=\"1\"/><text x=\"182.5861\" y=\"117.7940\" text-anchor=\"middle\" font-size=\"17\" fill=\"#251f21\">A</text><rect x=\"255\" y=\"57\" width=\"18\" height=\"18\" fill=\"#73a89a\" stroke=\"#251f21\"/><text x=\"284\" y=\"72\" font-size=\"17\" fill=\"#251f21\">A: 12 students</text><path d=\"M130,151 L220.3504,180.3566 A95,95 0 0,1 100.6434,241.3504 Z\" fill=\"#c4d7d0\" stroke=\"#251f21\" stroke-width=\"1\"/><text x=\"159.5094\" y=\"213.9154\" text-anchor=\"middle\" font-size=\"17\" fill=\"#251f21\">B</text><rect x=\"255\" y=\"92\" width=\"18\" height=\"18\" fill=\"#c4d7d0\" stroke=\"#251f21\"/><text x=\"284\" y=\"107\" font-size=\"17\" fill=\"#251f21\">B: 10 students</text><path d=\"M130,151 L100.6434,241.3504 A95,95 0 0,1 35.0000,151.0000 Z\" fill=\"#d4d4d4\" stroke=\"#251f21\" stroke-width=\"1\"/><text x=\"77.4139\" y=\"194.2060\" text-anchor=\"middle\" font-size=\"17\" fill=\"#251f21\">C</text><rect x=\"255\" y=\"127\" width=\"18\" height=\"18\" fill=\"#d4d4d4\" stroke=\"#251f21\"/><text x=\"284\" y=\"142\" font-size=\"17\" fill=\"#251f21\">C: 8 students</text><path d=\"M130,151 L35.0000,151.0000 A95,95 0 0,1 74.1604,74.1434 Z\" fill=\"#aeaeae\" stroke=\"#251f21\" stroke-width=\"1\"/><text x=\"72.0846\" y=\"126.4906\" text-anchor=\"middle\" font-size=\"17\" fill=\"#251f21\">D</text><rect x=\"255\" y=\"162\" width=\"18\" height=\"18\" fill=\"#aeaeae\" stroke=\"#251f21\"/><text x=\"284\" y=\"177\" font-size=\"17\" fill=\"#251f21\">D: 6 students</text><path d=\"M130,151 L74.1604,74.1434 A95,95 0 0,1 130.0000,56.0000 Z\" fill=\"#858585\" stroke=\"#251f21\" stroke-width=\"1\"/><text x=\"109.9139\" y=\"94.1813\" text-anchor=\"middle\" font-size=\"17\" fill=\"#251f21\">E</text><rect x=\"255\" y=\"197\" width=\"18\" height=\"18\" fill=\"#858585\" stroke=\"#251f21\"/><text x=\"284\" y=\"212\" font-size=\"17\" fill=\"#251f21\">E: 4 students</text><text x=\"210\" y=\"278\" text-anchor=\"middle\" font-size=\"14\" fill=\"#585254\">Authored from supplied textbook counts</text></svg>", "cap": "Grade counts are shown in the legend. Each sector angle is proportional to its count."}, {"id": "M8C10107", "q": "x and y are directly proportional. When x is 3, y is 12, and when x is 5, y is 20. What is y when x is 8?", "o": ["24", "32", "40", "28"], "a": 1, "x": "In direct proportion y is always the same multiple of x: 12 = 4 \u00d7 3 and 20 = 4 \u00d7 5, so at x = 8, y = 4 \u00d7 8 = 32.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C10108", "q": "Identical notebooks cost Rs 40 each, and Rs 600 buys 15 of them. If the price per notebook rises to Rs 50, how many notebooks does the same Rs 600 buy?", "o": ["18", "10", "20", "12"], "a": 3, "x": "The total money is fixed at 600 = 40 \u00d7 15. At Rs 50 each, 600 / 50 = 12 notebooks; a higher price means fewer notebooks.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C10109", "q": "A floor is covered completely by 300 identical square tiles, each of area 40 cm\u00b2. How many tiles of area 60 cm\u00b2 are needed to cover the same floor?", "o": ["240", "200", "450", "150"], "a": 1, "x": "The floor area is fixed: 300 \u00d7 40 = 12000 cm\u00b2. Larger tiles mean fewer tiles: 12000 / 60 = 200.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C10110", "q": "48 chocolates shared equally among 12 children give 4 chocolates each. If the same 48 chocolates are shared equally among 8 children, how many chocolates does each child get?", "o": ["5", "3", "6", "8"], "a": 2, "x": "The total is fixed at 48; fewer children means more each: 48 / 8 = 6 chocolates.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C01106", "q": "What is 12\u00b3?", "o": ["1728", "36", "1726", "144"], "a": 0, "x": "12\u00b3 = 12 \u00d7 12 \u00d7 12 = 144 \u00d7 12 = 1728. 144 is only 12\u00b2, and 36 is 12 \u00d7 3.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01067", "q": "A square cloth has area 125 square cm. An 11 cm by 11 cm square is cut out from a corner. What area remains, in square cm?", "o": ["14", "4", "11", "21"], "a": 1, "x": "The cut-out area is 11 \u00d7 11 = 121, so the remaining area is 125 - 121 = 4.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rdirectscal12", "q": "Meera reads 5 pages every 8 minutes. At the same rate, how many pages does she read in 28 minutes?", "o": ["14", "35/4", "35/2", "10"], "a": 2, "x": "She reads 5/8 of a page per minute, so in 28 minutes she reads 28 \u00d7 5/8 = 140/8 = 35/2 pages. Doubling 5 gives 10, but 28 minutes is 3.5 times 8 minutes, not 2 times.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rlineardist00", "q": "Solve 2(3x - 2) = 5x - 1.", "o": ["3", "4", "2", "5"], "a": 0, "x": "Distribute: (6 - 5)x = -1 + 4, so x = 3.", "t": "Linear equations", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
