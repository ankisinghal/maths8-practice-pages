<script>const D={"id": "mfa9fad356c", "date": "2026-10-21", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C10020", "q": "The three sides of a triangle are in ratio 3:4:5. If its shortest side is 6 cm, what is its perimeter, in cm?", "o": ["12", "30", "24", "18"], "a": 2, "x": "Scale factor 2 gives sides 6,8,10; sum 24.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10096", "q": "A 150-minute cricket session has warm-up/cool-down:batting:bowling:fielding times in ratio 3:4:3:5. How many minutes are spent on warm-up and cool-down together?", "o": ["30", "40", "15", "50"], "a": 0, "x": "The 15 ratio parts share 150 minutes, so each part is 10 minutes. This activity has 3 parts.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10015", "q": "Chairs occupy 25 rows of 12. Rearrange all chairs into rows of 20. How many rows are needed?", "o": ["20", "25", "12", "15"], "a": 3, "x": "Total 300 chairs;300/20=15 rows.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10090", "q": "Two identical constant-rate pumps fill a tank in 18 hours. How many hours do four such pumps need?", "o": ["12", "9", "6", "36"], "a": 1, "x": "The task needs 36 pump-hours. Four pumps need 36/4=9 hours.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C01078", "q": "Given 3375 = 3^3 \u00d7 5^3, find its positive cube root.", "o": ["225", "45", "9", "15"], "a": 3, "x": "Combine one 3 and one 5 from each identical group: 3 \u00d7 5 = 15.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01048", "q": "What is the largest possible cube of a two-digit positive integer?", "o": ["1000000", "9801", "970299", "999999"], "a": 2, "x": "The largest two-digit positive integer is 99;99^3=970299, six digits.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rdirectscal08", "q": "A recipe uses 2 cups of rice for 5 servings. At the same ratio, how many MORE cups of rice are needed for 20 servings than for 10 servings?", "o": ["4", "8", "2", "6"], "a": 0, "x": "For 20 servings: (2/5) \u00d7 20 = 8 cups. For 10 servings: (2/5) \u00d7 10 = 4 cups. The difference is 8 - 4 = 4 cups.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rsquarebound00", "q": "A square carpet has area 60 square metres. Its side length lies between which two consecutive whole numbers of metres?", "o": ["6 and 7", "7 and 8", "8 and 9", "5 and 6"], "a": 1, "x": "7^2 = 49 and 8^2 = 64, and 49 < 60 < 64, so the side length lies between 7 and 8 metres.", "t": "A Square and A Cube", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
