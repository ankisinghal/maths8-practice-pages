<script>const D={"id": "ma05c0a966f", "date": "2026-10-30", "type": "C01-C10", "level": 2, "qs": [{"id": "M8C07005", "q": "Each bus seats 54 people. If 204 people travel in 4 such buses, how many seats remain empty?", "o": ["8", "12", "16", "54"], "a": 1, "x": "Total seats=4 x 54=216; empty=216-204=12.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C07013", "q": "A girl is 1 and her brother 5 years old. After how many years will their ages be in ratio 1:2?", "o": ["2", "5", "3", "4"], "a": 2, "x": "At 3 more years they are 4 and 8. Equivalently 2(1+t)=5+t gives t=3.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C07014", "q": "Equal volumes of gold and water have masses in ratio 37:2. If 1 litre of water weighs 1 kg, what is the mass of 1 litre of gold, in kg?", "o": ["9.25", "18.5", "74", "37"], "a": 1, "x": "Gold mass is 37/2 times 1 kg=18.5 kg.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8C10017", "q": "A pump fills a tank in 3 hours; another fills it in 2 hours. At constant rates, what time in hours do they need together?", "o": ["1/5", "3/2", "5", "6/5"], "a": 3, "x": "Combined rate 1/3+1/2=5/6 tank/hour; time is reciprocal 6/5 hour.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8C10024", "q": "The chart has Car 30\u00b0, Walk 90\u00b0, Bus 120\u00b0, Cycle 60\u00b0 and Two-wheeler 60\u00b0. If 18 travel by car, how many children were surveyed?", "o": ["180", "72", "216", "108"], "a": 2, "x": "Car is 1/12 of survey, so total 18 x 12=216.", "t": "Proportional Reasoning-2", "svg": "<svg viewBox=\"0 0 440 330\" role=\"img\"><title>Transport pie chart with angles120,60,30,60,90</title><path d=\"M220 155 L220.0 30.0 A125 125 0 0 1 328.2531755 217.5 Z\" fill=\"#dae9f5\" stroke=\"#243c50\" stroke-width=\"2\"/><text x=\"287.5499815\" y=\"116.0\" font-family=\"system-ui,sans-serif\" font-size=\"19\" text-anchor=\"middle\">Bus</text><text x=\"287.5499815\" y=\"134.0\" font-size=\"20\" t
