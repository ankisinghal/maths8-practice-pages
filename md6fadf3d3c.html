<script>const D={"id": "md6fadf3d3c", "date": "2026-10-12", "type": "C01", "level": 2, "qs": [{"id": "M8C01036", "q": "Between which consecutive positive integers is the square root of 2800?", "o": ["52 and 53", "53 and 54", "54 and 55", "51 and 52"], "a": 0, "x": "52^2=2704 < 2800 < 2809=53^2, so 2800 is not a perfect square.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01003", "q": "What is the least positive perfect square divisible by 4, 9 and 10?", "o": ["180", "90", "900", "360"], "a": 2, "x": "Their LCM is 180 = 2^2 x 3^2 x 5. Multiply by 5 to pair every prime factor: 900 = 30^2.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01005", "q": "9408 is multiplied by the least positive integer that makes the product a perfect square. What is the square root of that product?", "o": ["168", "96", "84", "336"], "a": 0, "x": "The least multiplier is 3. 9408 x 3 = 28224 = 168 x 168.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01006", "q": "How many integers lie strictly between 16 squared and 17 squared?", "o": ["33", "32", "16", "34"], "a": 1, "x": "17^2 - 16^2 = 33. Excluding both endpoints leaves 33 - 1 = 32 integers.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01010", "q": "What is the least positive integer that must multiply 1323 to make a perfect cube?", "o": ["3", "7", "21", "49"], "a": 1, "x": "1323 = 3^3 x 7^2. Multiply by 7 to complete the group of three 7 s: 1323 x 7 = 9261 = 21^3.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8C01031", "q": "Initially 100 lockers numbered 1-100 are closed. Person k toggles every locker whose number is a multiple of k, for k=1 through 100. How many lockers are open at the end?", "o": ["9", "50", "10", "100"], "a": 2, "x": "Locker n is toggled once per positive divisor. Divisors pair except for perfect squares, which have an odd number of divisors. The ten squares 1^2 through 10^2 remain open.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rrationalad00", "q": "Find (-1/3) + (1/4).", "o": ["1/12", "7/12", "11/12", "-1/12"], "a": 3, "x": "Use a common denominator: -1/3 + 1/4 = -1/12.", "t": "Rational numbers", "svg": "", "cap": ""}, {"id": "M8Rcuberootpo00", "q": "Find the positive cube root of 2744.", "o": ["13", "15", "16", "14"], "a": 3, "x": "14 x 14 x 14 = 2744.", "t": "A Square and A Cube", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
