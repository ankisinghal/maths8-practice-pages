greatest value?", "o": ["43^3 - 42^3", "67^2 - 66^2", "43^2 - 42^2", "67^3 - 66^3"], "a": 3, "x": "A cube difference n^3-(n-1)^3 equals 3n(n-1)+1: 67^3-66^3 = 3 \u00d7 67 \u00d7 66 + 1 = 13267 and 43^3-42^3 = 3 \u00d7 43 \u00d7 42 + 1 = 5419. The square differences are just 2n-1: 133 and 85. The greatest is 67^3 - 66^3.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rdirectscal09", "q": "A recipe uses 3 cups of flour for 9 servings. At the same ratio, how many cups are needed for 15 servings?", "o": ["4", "5", "6", "9"], "a": 1, "x": "Each serving needs 3/9 = 1/3 cup. For 15 servings: 15 \u00d7 1/3 = 5 cups.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rcubeminmul00", "q": "What is the least positive integer that must multiply 108 to make a perfect cube?", "o": ["6", "3", "2", "4"], "a": 2, "x": "108 = 2^2 \u00d7 3^3. One more 2 completes a group of three: 108 \u00d7 2 = 216 = 6^3.", "t": "A Square and A Cube", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
