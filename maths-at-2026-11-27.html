<style>h1{overflow-wrap:anywhere}.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{overflow-wrap:anywhere;border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>C01-C10 practice m321d80eadb</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "m321d80eadb", "date": "2026-11-27", "type": "C01-C10", "level": 2, "qs": [{"id": "M8Rsubstitute10", "q": "Evaluate 6a(2a - 5) at a = -5.", "o": ["455", "450", "-450", "150"], "a": 1, "x": "Substitute a = -5: 2a - 5 = -15 and 6a = -30, so the value is (-30) x (-15) = 450.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8Rsquareminm11", "q": "What is the least positive integer by which 153 must be multiplied to make a perfect square?", "o": ["9", "34", "17", "3"], "a": 2, "x": "153 = 9 x 17 = 3^2 x 17. The unpaired prime is 17, so multiply by 17.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rconsecutivegap07", "q": "How many whole numbers lie strictly between 23 squared and 24 squared?", "o": ["48", "47", "45", "46"], "a": 3, "x": "Between n^2 and (n+1)^2 there are exactly 2n whole numbers: 2 x 23 = 46.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rsquarepar04", "q": "Initially 150 lockers numbered 1 to 150 are all closed. For each k from 1 to 150, person k toggles every locker whose number is a multiple of k. How many lockers are open at the end?", "o": ["13", "12", "75", "11"], "a": 1, "x": "Only perfect-square lockers end open (odd divisor count). Squares up to 150: 1, 4, 9, ..., 144 - that is 12 lockers.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rinvshare03", "q": "420 chapatis shared equally among 28 people give 15 chapatis each. If the same 420 chapatis are shared equally among 20 people, how many chapatis does each person get?", "o": ["21", "28", "15", "20"], "a": 0, "x": "The total is fixed at 420; fewer people means more each: 420 / 20 = 21 chapatis.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}, {"id": "M8Rdirectpairs03", "q": "Which set of ordered pairs (x, y) shows x and y in direct proportion?", "o": ["(2, 22), (6, 66), (9, 99)", "(1, 11), (5, 55), (10, 105)", "(4, 44), (8, 88), (15, 160)", "(3, 33), (7, 77), (12, 130)"], "a": 0, "x": "Direct proportion needs the same ratio y/x throughout: here y = 11x for all three pairs. Each other set has one pair with a different ratio.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rdirectfactor03", "q": "A photocopier copies at a fixed rate. If it runs for 11/6 times as long, the number of copies made becomes what multiple of the original?", "o": ["2", "11/6", "6/11", "5"], "a": 1, "x": "Copies and time are in direct proportion at a fixed rate, so the count multiplies by the same factor: 11/6.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rsquaredec00", "q": "What is 2.5 squared?", "o": ["6.5", "5", "6.25", "5.25"], "a": 2, "x": "2.5^2 = 2.5 x 2.5 = 6.25.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rageratio00", "q": "A girl is 2 years old and her brother is 10. After how many years will their ages be in the ratio 1:2?", "o": ["6", "2", "4", "8"], "a": 0, "x": "After t years, (2 + t)/(10 + t) = 1/2, so 4 + 2t = 10 + t and t = 6 years.", "t": "Proportional Reasoning-1", "svg": "", "cap": ""}, {"id": "M8Rcombwork00", "q": "One tap fills a tank in 5 hours; another tap fills it in 15 hours. At constant rates, how many hours do they need together?", "o": ["20", "4", "10", "15/4"], "a": 3, "x": "Together they fill 1/5 + 1/15 = 4/15 of the tank per hour, so they need 15/4 hours.", "t": "Proportional Reasoning-2", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
