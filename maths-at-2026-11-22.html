<style>h1{overflow-wrap:anywhere}.diagram{margin:1rem 0}.diagram svg{display:block;width:100%;max-width:460px;height:auto;margin:auto}.diagram figcaption{font-size:.85rem;color:#555;margin-top:.4rem}body{font-family:system-ui,sans-serif;color:#251f21;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{overflow-wrap:anywhere;border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.6rem 0;min-height:24px}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>C01-C10 practice m2892b25765</h1><p>10 questions &middot; level L2 &middot; about 20 to 25 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "m2892b25765", "date": "2026-11-22", "type": "C01-C10", "level": 2, "qs": [{"id": "M8Rexprpct01", "q": "A school library had 240 books last year and has 300 books this year. What percentage of last year's count is this year's count?", "o": ["120%", "125%", "80%", "115%"], "a": 1, "x": "300/240 = 1.25, so this year's count is 125% of last year's.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rprofitpct01", "q": "A florist buys a bouquet for Rs 425 and sells it for Rs 459. What is the exact profit percentage on the cost price?", "o": ["12%", "9%", "7%", "8%"], "a": 3, "x": "Profit = 459 - 425 = 34. Divide by cost 425 and multiply by 100: 8%.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rcompound01", "q": "Rs 8000 earns 5% interest compounded annually for 3 years. What is the final amount in rupees?", "o": ["9250", "9261", "1261", "9200"], "a": 1, "x": "After year 1: 8000 x 1.05 = 8400. After year 2: 8400 x 1.05 = 8820. After year 3: 8820 x 1.05 = 9261.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsuccdisc01", "q": "A phone has a marked price of Rs 5000. Successive discounts of 20% and then 5% are applied. What is its final price, in rupees?", "o": ["3800", "3750", "3900", "4000"], "a": 0, "x": "After 20% off, price 5000 x 0.8 = 4000. After 5% off that, 4000 x 0.95 = 3800.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rmarkdisc01", "q": "A seller marks an item 40% above its cost. What discount percentage on the marked price brings the selling price exactly back to cost?", "o": ["200/7", "40", "50", "28"], "a": 0, "x": "Take cost as 100; the marked price is 140. The discount is 40 relative to 140, and 40/140 = 2/7, which is 200/7 percent.", "t": "Fractions in Disguise", "svg": "", "cap": ""}, {"id": "M8Rsubstitute07", "q": "Evaluate 4a(2a - 5) at a = -6.", "o": ["168", "-408", "408", "360"], "a": 2, "x": "Substitute -6: 4 x (-6) x (-17) = 408.", "t": "We Distribute, Yet Things Multiply", "svg": "", "cap": ""}, {"id": "M8Rsquareminm08", "q": "What is the least positive integer by which 99 must be multiplied to make a perfect square?", "o": ["2", "3", "9", "11"], "a": 3, "x": "99 = 9 x 11 = 3^2 x 11, so one more factor of 11 is needed: 99 x 11 = 1089 = 33^2. All smaller positive multipliers fail.", "t": "A Square and A Cube", "svg": "", "cap": ""}, {"id": "M8Rinvshare00", "q": "192 sweets shared equally among 16 children give 12 sweets each. If the same 192 sweets are shared equally among 8 children, how many sweets does each child get?", "o": ["12", "20", "24", "16"], "a": 2, "x": "The total is fixed at 192; fewer children means more each: 192 / 8 = 24 sweets.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}, {"id": "M8Rdirectpairs00", "q": "Which set of ordered pairs (x, y) shows x and y in direct proportion?", "o": ["(4, 28), (7, 49), (12, 90)", "(1, 7), (4, 21), (6, 42)", "(3, 21), (6, 42), (10, 75)", "(2, 14), (5, 35), (9, 63)"], "a": 3, "x": "In direct proportion y/x stays constant. Here 14/2 = 35/5 = 63/9 = 7; every other set has at least one pair with a different ratio.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}, {"id": "M8Rdirectfactor00", "q": "A printer prints at a fixed rate. If it prints for 9/4 times as long, the number of pages printed becomes what multiple of the original?", "o": ["9/4", "4/9", "2", "3"], "a": 0, "x": "Pages and time are in direct proportion at a fixed rate, so the page count multiplies by the same factor 9/4.", "t": "Direct and Inverse Proportion", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div></div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="M8"+ "|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent).then(()=>document.getElementById("copy").textContent="Copied. Paste it in your chat.").catch(()=>document.getElementById("copy").textContent="Copy failed. Select and copy the code above.")};
</script></body></html>
